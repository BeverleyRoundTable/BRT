<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeRaver Live Drop Dashboard</title>
    
    <!-- Preload BRT Custom Font -->
    <link rel="preload" href="https://brt-23f.pages.dev/site/Eurostile_Extended_2_Bold.woff2" as="font" type="font/woff2" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Eurostile', 'sans-serif'], 
                        body: ['Open Sans', 'sans-serif'],
                    },
                    colors: {
                        beraverBlue: '#4db8e8',
                        beraverPink: '#ff007f',
                        beraverDark: '#1D1D1A',
                    }
                }
            }
        }
    </script>

    <style>
        /* BRT Eurostile Font Injection */
        @font-face {
            font-family: 'Eurostile';
            src: url('https://raw.githubusercontent.com/BeverleyRoundTable/BRT/main/site/Eurostile_Extended_2_Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #1D1D1A;
            color: #FFFFFF;
            overflow: hidden; /* Lock screen for monitor display */
            user-select: none;
        }

        .neon-text-blue {
            text-shadow: 0 0 15px rgba(77, 184, 232, 0.8), 0 0 30px rgba(77, 184, 232, 0.6);
        }

        .neon-text-pink {
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8), 0 0 30px rgba(255, 0, 127, 0.6);
        }

        /* Rave Strobe Animation for the Drop Overlay */
        @keyframes strobe {
            0%, 100% { background-color: rgba(255, 0, 127, 0.95); }
            50% { background-color: rgba(77, 184, 232, 0.95); }
        }

        .strobe-active {
            animation: strobe 0.3s infinite;
        }

        /* Scrolling ticker for recent donations */
        .donor-list {
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
        }
        .donor-list::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
    </style>
</head>

<!-- Swapped h-screen for h-[100dvh] to fix mobile browser URL bar overlap pushing content off-screen -->
<body class="h-[100dvh] w-full flex flex-col relative bg-beraverDark">

    <!-- Background Pattern -->
    <div class="absolute inset-0 z-0 opacity-20" style="background-image: repeating-linear-gradient(45deg, #4db8e8 25%, transparent 25%, transparent 75%, #4db8e8 75%, #4db8e8), repeating-linear-gradient(45deg, #4db8e8 25%, #1D1D1A 25%, #1D1D1A 75%, #4db8e8 75%, #4db8e8); background-position: 0 0, 20px 20px; background-size: 40px 40px;"></div>
    <div class="absolute inset-0 z-0 bg-beraverDark/85 backdrop-blur-sm"></div>

    <!-- Header / Logo -->
    <header class="w-full pt-6 pb-2 px-6 flex justify-center md:justify-start relative z-10 shrink-0">
        <img src="https://brt-23f.pages.dev/images/BERAVER.png" alt="BeRaver Logo" class="w-48 md:w-56 drop-shadow-2xl">
    </header>

    <!-- Main Dashboard Content -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-start md:justify-center w-full px-4 md:px-8 pb-10 md:pb-12 gap-4 md:gap-6 overflow-hidden">
        
        <!-- Massive Total Raised Section (flex-1 to greedily take up all available screen real estate) -->
        <div class="w-full max-w-5xl bg-black/50 rounded-3xl p-6 md:p-10 border-4 border-beraverBlue shadow-[0_0_50px_rgba(77,184,232,0.3)] flex flex-col items-center justify-center backdrop-blur-md flex-1">
            <h1 class="font-heading font-black text-2xl md:text-5xl text-gray-300 uppercase tracking-widest mb-2 md:mb-4 text-center leading-tight">Total Raised for Beverley Round Table</h1>
            <div class="font-heading font-black text-7xl md:text-[9rem] text-beraverBlue neon-text-blue transition-all duration-300 leading-none">
                £<span id="total-amount">0</span>
            </div>
        </div>

        <!-- Recent Drops Feed (Fixed maximum height relative to screen to ensure it never overflows) -->
        <div class="w-full max-w-5xl bg-black/50 rounded-3xl p-4 md:p-6 border-4 border-beraverPink shadow-[0_0_40px_rgba(255,0,127,0.2)] flex flex-col backdrop-blur-md shrink-0 h-[35vh] md:h-72">
            <h2 class="font-heading font-black text-center text-xl md:text-3xl text-beraverPink border-b-2 border-beraverPink pb-2 mb-3 uppercase tracking-wide shrink-0">Live Drops (Zeffy)</h2>
            
            <div id="donor-feed" class="donor-list flex flex-col gap-3 font-body flex-1">
                <!-- Initial placeholder state -->
                <div class="text-gray-500 text-lg md:text-xl font-bold text-center py-4" id="feed-placeholder">
                    Listening for incoming drops...
                </div>
            </div>
        </div>
        
    </main>

    <!-- Footer details -->
    <footer class="absolute bottom-4 w-full text-center z-10 text-gray-500 font-heading font-bold tracking-widest text-xs md:text-sm uppercase hidden md:block">
        Beverley Round Table • Est. 1950 • Powered by Zendure
    </footer>

    <!-- THE DROP OVERLAY (Hidden by default) -->
    <div id="drop-overlay" class="fixed inset-0 z-50 hidden flex-col items-center justify-center p-8 text-center">
        <h1 class="font-heading font-black text-7xl md:text-9xl text-white uppercase tracking-widest drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] mb-4 scale-0 transition-transform duration-300 ease-out" id="drop-title">
            NEW DONATION!
        </h1>
        
        <div id="drop-details" class="bg-black/90 border-4 border-white rounded-3xl p-12 shadow-2xl scale-0 transition-transform duration-500 delay-100 ease-out">
            <p class="font-heading font-bold text-4xl md:text-5xl text-gray-300 uppercase tracking-wider mb-4">Incoming Drop From</p>
            <p id="drop-name" class="font-heading font-black text-6xl md:text-8xl text-beraverBlue neon-text-blue mb-6">NAME</p>
            <div class="inline-block bg-beraverPink text-white font-heading font-black text-5xl md:text-7xl py-4 px-8 rounded-full shadow-[0_0_30px_rgba(255,0,127,0.8)] mb-6">
                £<span id="drop-amount-text">0.00</span>
            </div>
            <p id="drop-msg" class="font-body font-bold text-2xl md:text-3xl text-gray-200 italic">"Message goes here"</p>
        </div>
    </div>

    <script>
        // ==========================================
        // DASHBOARD STATE & AUDIO
        // ==========================================
        let currentTotal = 0;
        let lastDonationId = null;
        let isInitialLoad = true;

        const totalAmountEl = document.getElementById('total-amount');
        const donorFeedEl = document.getElementById('donor-feed');
        const feedPlaceholder = document.getElementById('feed-placeholder');
        const overlay = document.getElementById('drop-overlay');
        const overlayTitle = document.getElementById('drop-title');
        const overlayDetails = document.getElementById('drop-details');

        let audioCtx; 

        function playRaveHorn() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                // Rapid stuttering rave horn effect
                for(let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
                        
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime); 
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.3);
                    }, i * 150);
                }
            } catch (e) {
                console.warn("Audio blocked, visually proceeding.", e);
            }
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const current = Math.floor(progress * (end - start) + start);
                obj.innerHTML = current.toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end.toLocaleString(); // Ensure final exact value
                }
            };
            window.requestAnimationFrame(step);
        }

        // Helper to silently add drops to feed (used on initial load)
        function addDonationToFeed(name, amount, message) {
            if (feedPlaceholder) feedPlaceholder.style.display = 'none';
            
            const entry = document.createElement('div');
            entry.className = 'flex justify-between items-center bg-black/60 p-4 rounded-xl border border-white/10 animate-[pulse_1s_ease-in-out]';
            entry.innerHTML = `
                <div class="flex flex-col">
                    <span class="text-xl md:text-2xl font-bold text-white">${name || "Anonymous Raver"}</span>
                    <span class="text-sm md:text-base text-gray-400 italic">${message ? `"${message}"` : ""}</span>
                </div>
                <div class="font-heading font-black text-2xl md:text-4xl text-beraverBlue ml-4">£${parseFloat(amount).toFixed(2)}</div>
            `;
            donorFeedEl.insertBefore(entry, donorFeedEl.firstChild);
        }

        // Full cinematic drop for live donations
        function triggerDonationDrop(name, amount, message) {
            playRaveHorn();

            document.getElementById('drop-name').innerText = name || "Anonymous Raver";
            document.getElementById('drop-amount-text').innerText = parseFloat(amount).toFixed(2);
            document.getElementById('drop-msg').innerText = message ? `"${message}"` : "";

            overlay.classList.remove('hidden');
            overlay.classList.add('flex', 'strobe-active');
            
            setTimeout(() => overlayTitle.classList.replace('scale-0', 'scale-100'), 50);
            setTimeout(() => overlayDetails.classList.replace('scale-0', 'scale-100'), 150);

            addDonationToFeed(name, amount, message);

            // Hide Overlay after 6 seconds
            setTimeout(() => {
                overlayTitle.classList.replace('scale-100', 'scale-0');
                overlayDetails.classList.replace('scale-100', 'scale-0');
                
                setTimeout(() => {
                    overlay.classList.remove('flex', 'strobe-active');
                    overlay.classList.add('hidden');
                }, 300);
            }, 6000);
        }

        // ==========================================
        // ZEFFY LIVE POLLING
        // ==========================================
        const WORKER_URL = "https://zeffywebhook.beverley247.workers.dev";
        
        async function pollLatestDonation() {
            try {
                const response = await fetch(WORKER_URL);
                if (!response.ok) return;
                
                const data = await response.json();
                
                // 1. Sync the total raised directly from the worker
                if (typeof data.total === 'number') {
                    if (currentTotal !== data.total) {
                        animateValue(totalAmountEl, currentTotal, data.total, 1000);
                        currentTotal = data.total;
                    }
                }
                
                // 2. Process new individual drops
                if (data.id && data.id !== lastDonationId) {
                    const donorName = data.name || "Anonymous Raver";
                    const donorAmount = data.amount || 0;
                    const donorMessage = data.message || "";

                    if (!isInitialLoad) {
                        triggerDonationDrop(donorName, donorAmount, donorMessage);
                    } else {
                        // Just seed the feed on page load without blowing the horns
                        addDonationToFeed(donorName, donorAmount, donorMessage);
                    }
                    lastDonationId = data.id; 
                }
                isInitialLoad = false;
            } catch (error) {
                console.error("Worker fetch failed:", error);
            }
        }

        // Poll every 5 seconds
        setInterval(pollLatestDonation, 5000);
        pollLatestDonation(); 
    </script>
    <!-- ==========================================
         KEEP AWAKE (blocks screensaver / screen sleep)
         1. Native Screen Wake Lock API (Chrome, Edge, Safari 16.4+, Firefox 126+)
         2. Fallback: hidden looping video for browsers without the API
         Needs HTTPS. Some browsers only grant it after a first tap/click/keypress.
         ========================================== -->

    (function () {
        var wakeLock = null;
        var fallbackVideo = null;
        var wantAwake = true;

        function log(msg) { console.log('[KeepAwake] ' + msg); }

        async function requestNativeLock() {
            if (!('wakeLock' in navigator)) return false;
            if (wakeLock && !wakeLock.released) return true;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', function () {
                    log('lock released');
                    if (wantAwake && document.visibilityState === 'visible') setTimeout(acquire, 1000);
                });
                log('native wake lock active');
                return true;
            } catch (err) {
                log('native lock refused (' + err.name + '), will retry on next interaction');
                return false;
            }
        }

            mp4.type = 'video/mp4';
            v.appendChild(webm);
            v.appendChild(mp4);
            document.body.appendChild(v);
            fallbackVideo = v;
            var p = v.play();
            if (p && typeof p.then === 'function') {
                p.then(function () { log('fallback video playing'); })
                 .catch(function () { log('fallback video blocked until user interaction'); });
            }
        }

        async function acquire() {
            if (!wantAwake) return;
            var ok = await requestNativeLock();
            if (!ok) startFallbackVideo();
        }

        // Re-acquire whenever the tab comes back (locks are dropped when hidden)
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') acquire();
        });

        // Retry on first user gesture (needed by iOS and some desktop browsers)
        ['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (evt) {
            document.addEventListener(evt, function () { acquire(); }, { passive: true });
        });

        window.addEventListener('pageshow', acquire);
        window.addEventListener('focus', acquire);

        // Safety net: heartbeat in case the lock silently drops
        setInterval(function () {
            if (document.visibilityState !== 'visible') return;
            if ('wakeLock' in navigator) {
                if (!wakeLock || wakeLock.released) acquire();
            } else if (fallbackVideo && fallbackVideo.paused) {
                var r2 = fallbackVideo.play(); if (r2 && r2.catch) r2.catch(function () {});
            }
        }, 15000);

        acquire();
    })();
    </script>

</html>
