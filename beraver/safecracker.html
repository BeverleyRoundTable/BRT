<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crack the Safe Tracker | BeRaver</title>
    
    <!-- Preload BRT Custom Font -->
    <link rel="preload" href="https://brt-23f.pages.dev/site/Eurostile_Extended_2_Bold.woff2" as="font" type="font/woff2" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Eurostile', 'sans-serif'], 
                        body: ['Open Sans', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        beraverBlue: '#4db8e8',
                        beraverPink: '#ff007f',
                        beraverDark: '#1D1D1A',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* BRT Eurostile Font Injection */
        @font-face {
            font-family: 'Eurostile';
            src: url('https://raw.githubusercontent.com/BeverleyRoundTable/BRT/main/site/Eurostile_Extended_2_Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #1D1D1A; 
            color: white;
            user-select: none; 
        }

        .neon-text-blue {
            text-shadow: 0 0 10px rgba(77, 184, 232, 0.7), 0 0 20px rgba(77, 184, 232, 0.5);
        }
        .neon-text-pink {
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7), 0 0 20px rgba(255, 0, 127, 0.5);
        }

        .game-title {
            font-family: 'Eurostile', sans-serif;
            font-weight: 700;
        }

        .game-btn {
            transition: transform 0.1s, filter 0.1s, box-shadow 0.1s;
        }
        .game-btn:active {
            transform: translateY(4px);
        }
        .btn-blue:active { box-shadow: 0 0px 0 #2d80a8 !important; }
        .btn-pink:active { box-shadow: 0 0px 0 #b30059 !important; }
        .btn-gray:active { box-shadow: 0 0px 0 #4a4a4a !important; }

        /* Digital Display Styling */
        .digit-box {
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Overlay Background */
        .overlay-bg {
            background: rgba(29, 29, 26, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="flex flex-col h-screen w-full p-4 lg:p-6 overflow-hidden relative bg-beraverDark">

    <!-- Background Pattern -->
    <div class="absolute inset-0 z-0 opacity-20" style="background-image: repeating-linear-gradient(45deg, #4db8e8 25%, transparent 25%, transparent 75%, #4db8e8 75%, #4db8e8), repeating-linear-gradient(45deg, #4db8e8 25%, #1D1D1A 25%, #1D1D1A 75%, #4db8e8 75%, #4db8e8); background-position: 0 0, 20px 20px; background-size: 40px 40px;"></div>
    <div class="absolute inset-0 z-0 bg-beraverDark/90 backdrop-blur-sm"></div>

    <!-- Header -->
    <header class="relative z-10 flex justify-between items-center mb-6 flex-shrink-0">
        <div class="flex items-center gap-4">
            <img src="https://brt-23f.pages.dev/icons/BRTLogo.png" alt="BRT Logo" class="w-12 h-12 drop-shadow-xl">
            <h1 class="game-title text-3xl md:text-4xl font-black uppercase tracking-wider">
                Crack The <span class="text-beraverPink neon-text-pink">Safe</span>
            </h1>
        </div>
        <div class="text-right">
            <span class="text-beraverBlue font-heading uppercase tracking-widest text-sm font-bold block">BeRaver Fun Zone</span>
            <span class="text-gray-400 font-body text-xs">£2 Per Guess</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="relative z-10 flex-1 flex flex-col lg:flex-row gap-6 items-stretch w-full min-h-0">
        
        <!-- Left Column: The Keypad -->
        <section class="w-full lg:w-2/5 bg-black/60 backdrop-blur-md rounded-3xl p-6 border-4 border-beraverBlue flex flex-col shadow-2xl relative min-h-0">
            
            <!-- Digital Display -->
            <div class="bg-black border-2 border-white/20 rounded-xl p-4 mb-6 flex justify-center gap-3">
                <div id="disp-1" class="digit-box w-14 h-20 md:w-16 md:h-24 bg-gray-900 rounded-lg border border-gray-700 flex items-center justify-center text-4xl md:text-5xl font-mono font-bold text-white">-</div>
                <div id="disp-2" class="digit-box w-14 h-20 md:w-16 md:h-24 bg-gray-900 rounded-lg border border-gray-700 flex items-center justify-center text-4xl md:text-5xl font-mono font-bold text-white">-</div>
                <div id="disp-3" class="digit-box w-14 h-20 md:w-16 md:h-24 bg-gray-900 rounded-lg border border-gray-700 flex items-center justify-center text-4xl md:text-5xl font-mono font-bold text-white">-</div>
                <div id="disp-4" class="digit-box w-14 h-20 md:w-16 md:h-24 bg-gray-900 rounded-lg border border-gray-700 flex items-center justify-center text-4xl md:text-5xl font-mono font-bold text-white">-</div>
            </div>

            <!-- Status Message -->
            <div id="status-msg" class="text-center font-heading text-lg h-8 mb-4 uppercase tracking-widest text-gray-400">
                Awaiting Input...
            </div>

            <!-- Keypad -->
            <div class="grid grid-cols-3 gap-3 md:gap-4 flex-1">
                <!-- Numbers injected by JS -->
                <button onclick="inputDigit('1')" class="game-btn btn-blue bg-white hover:bg-gray-200 text-beraverDark text-3xl font-heading font-black rounded-xl shadow-[0_6px_0_#cccccc]">1</button>
                <button onclick="inputDigit('2')" class="game-btn btn-blue bg-white hover:bg-gray-200 text-beraverDark text-3xl font-heading font-black rounded-xl shadow-[0_6px_0_#cccccc]">2</button>
                <button onclick="inputDigit('3')" class="game-btn btn-blue bg-white hover:bg-gray-200 text-beraverDark text-3xl font-heading font-black rounded-xl shadow-[0_6px_0_#cccccc]">3</button>
                <button onclick="inputDigit('4')" class="game-btn btn-blue bg-white hover:bg-gray-200 text-beraverDark text-3xl font-heading font-black rounded-xl shadow-[0_6px_0_#cccccc]">4</button>
                <button onclick="inputDigit('5')" class="game-btn btn-blue bg-white hover:bg-gray-200 text-beraverDark text-3xl font-heading font-black rounded-xl shadow-[0_6px_0_#cccccc]">5</button>
                <button onclick="inputDigit('6')" class="game-btn btn-blue bg-white hover:bg-gray-200 text-beraverDark text-3xl font-heading font-black rounded-xl shadow-[0_6px_0_#cccccc]">6</button>
                <button onclick="inputDigit('7')" class="game-btn btn-blue bg-white hover:bg-gray-200 text-beraverDark text-3xl font-heading font-black rounded-xl shadow-[0_6px_0_#cccccc]">7</button>
                <button onclick="inputDigit('8')" class="game-btn btn-blue bg-white hover:bg-gray-200 text-beraverDark text-3xl font-heading font-black rounded-xl shadow-[0_6px_0_#cccccc]">8</button>
                <button onclick="inputDigit('9')" class="game-btn btn-blue bg-white hover:bg-gray-200 text-beraverDark text-3xl font-heading font-black rounded-xl shadow-[0_6px_0_#cccccc]">9</button>
                
                <button onclick="clearInput()" class="game-btn btn-gray bg-gray-600 hover:bg-gray-500 text-white text-xl font-heading font-black rounded-xl shadow-[0_6px_0_#4a4a4a] uppercase">Clear</button>
                <button onclick="inputDigit('0')" class="game-btn btn-blue bg-white hover:bg-gray-200 text-beraverDark text-3xl font-heading font-black rounded-xl shadow-[0_6px_0_#cccccc]">0</button>
                <button onclick="submitGuess()" id="btn-submit" class="game-btn btn-pink bg-beraverPink hover:bg-[#e60073] text-white text-xl font-heading font-black rounded-xl shadow-[0_6px_0_#b30059] uppercase">Guess</button>
            </div>
        </section>

        <!-- Right Column: The Tracker Grid -->
        <section class="w-full lg:w-3/5 bg-black/60 backdrop-blur-md rounded-3xl p-6 border-4 border-beraverPink flex flex-col shadow-2xl relative min-h-0">
            <div class="flex justify-between items-end border-b-2 border-beraverPink pb-2 mb-4 flex-shrink-0">
                <h2 class="game-title text-2xl lg:text-3xl text-beraverPink uppercase">Sequence Tracker</h2>
                <span id="tracker-count" class="font-mono text-gray-400 text-sm">0 / 10000 Marked Off</span>
            </div>
            
            <!-- Scrolling Blocks Container -->
            <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar flex flex-col gap-4" id="tracker-container">
                <!-- Groups (0000s, 1000s, etc.) generated by JS -->
            </div>
        </section>
    </main>

    <!-- Setup Modal (Initial Load) -->
    <div id="setup-modal" class="fixed inset-0 z-50 overlay-bg flex flex-col items-center justify-center p-4">
        <div class="bg-beraverDark border-4 border-beraverBlue rounded-3xl p-8 max-w-md w-full text-center shadow-[0_0_50px_rgba(77,184,232,0.3)]">
            <h2 class="game-title text-3xl text-white mb-2 uppercase">Lock The Safe</h2>
            <p class="font-body text-gray-400 mb-6 text-sm">Enter the 4-digit Master Code that matches the physical padlock. This code will crack the digital safe.</p>
            
            <input type="password" id="master-code-input" maxlength="4" pattern="\d{4}" class="w-full bg-black border-2 border-gray-600 rounded-xl text-center text-4xl font-mono text-white py-4 mb-6 focus:border-beraverBlue focus:outline-none tracking-[1em] pl-[1em]" placeholder="****" autocomplete="off">
            
            <button onclick="lockSafe()" class="w-full game-btn btn-blue bg-beraverBlue hover:bg-[#3ba4d4] text-beraverDark text-2xl font-heading font-black uppercase tracking-wider py-4 rounded-xl shadow-[0_6px_0_#2d80a8]">
                Set Code & Start
            </button>
        </div>
    </div>

    <!-- Win / Cracked Modal -->
    <div id="win-modal" class="hidden fixed inset-0 z-50 overlay-bg flex flex-col items-center justify-center p-4">
        <div class="text-center animate-bounce">
            <h1 class="game-title text-6xl lg:text-9xl font-black mb-2 text-beraverBlue neon-text-blue uppercase">SAFE CRACKED!</h1>
            <p class="font-body text-2xl lg:text-4xl text-white mb-12 font-bold">We have a winner!</p>
            
            <button onclick="resetGame()" class="game-btn btn-pink bg-beraverPink hover:bg-[#e60073] text-white text-xl lg:text-2xl font-heading font-black uppercase tracking-wider py-4 px-12 rounded-full shadow-[0_6px_0_#b30059]">
                Reset Game Board
            </button>
        </div>
    </div>

    <script>
        // --- State Variables ---
        let masterCode = "";
        let currentInput = "";
        let wrongGuesses = new Set(); // Stores marked-off strings like "0123"

        // --- Audio Setup (Festival Sound Vibes) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, type, duration, vol=0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // --- Initialization & Setup ---
        function initTrackerUI() {
            const container = document.getElementById('tracker-container');
            container.innerHTML = '';
            // Create 10 blocks: 0000s to 9000s
            for(let i=0; i<10; i++) {
                container.innerHTML += `
                    <div class="bg-black/40 border border-white/10 rounded-xl p-4 hidden" id="group-${i}">
                        <h3 class="font-heading font-bold text-gray-500 mb-2 uppercase tracking-widest text-sm border-b border-gray-700 pb-1">${i}000 - ${i}999</h3>
                        <div class="flex flex-wrap gap-2" id="badges-${i}">
                            <!-- Badges injected here -->
                        </div>
                    </div>
                `;
            }
        }

        function lockSafe() {
            const input = document.getElementById('master-code-input').value;
            if (input.length === 4 && /^\d+$/.test(input)) {
                masterCode = input;
                document.getElementById('setup-modal').classList.add('hidden');
                initTrackerUI();
                playBeep(800, 'sine', 0.2);
                
                // Focus out so physical keyboard works immediately for playing
                document.getElementById('master-code-input').blur();
            } else {
                alert("Please enter exactly 4 digits.");
            }
        }

        // --- Keypad Logic ---
        function updateDisplay() {
            for (let i = 0; i < 4; i++) {
                const disp = document.getElementById(`disp-${i+1}`);
                if (i < currentInput.length) {
                    disp.innerText = currentInput[i];
                    disp.classList.add('text-white', 'neon-text-blue');
                } else {
                    disp.innerText = "-";
                    disp.classList.remove('text-white', 'neon-text-blue');
                }
            }
            
            const submitBtn = document.getElementById('btn-submit');
            if (currentInput.length === 4) {
                submitBtn.classList.remove('opacity-50');
            } else {
                submitBtn.classList.add('opacity-50');
            }
        }

        function inputDigit(digit) {
            if (currentInput.length < 4) {
                currentInput += digit;
                playBeep(400 + (parseInt(digit)*50), 'square', 0.1, 0.05);
                updateDisplay();
            }
        }

        function clearInput() {
            currentInput = "";
            playBeep(300, 'sawtooth', 0.1);
            setStatus("Cleared", "text-gray-400");
            updateDisplay();
        }

        function setStatus(msg, colorClass) {
            const statusEl = document.getElementById('status-msg');
            statusEl.innerText = msg;
            statusEl.className = `text-center font-heading text-lg h-8 mb-4 uppercase tracking-widest ${colorClass}`;
            
            // Reset to default after 2 seconds if not a permanent state
            if(msg !== "Awaiting Input...") {
                setTimeout(() => {
                    if (document.getElementById('status-msg').innerText === msg) {
                        setStatus("Awaiting Input...", "text-gray-400");
                    }
                }, 2500);
            }
        }

        // --- Core Game Logic ---
        function submitGuess() {
            if (currentInput.length !== 4) {
                setStatus("Requires 4 Digits", "text-beraverPink");
                playBeep(200, 'sawtooth', 0.3);
                return;
            }

            if (wrongGuesses.has(currentInput)) {
                setStatus("Already Guessed!", "text-yellow-400");
                playBeep(200, 'sawtooth', 0.3);
                clearInput();
                return;
            }

            if (currentInput === masterCode) {
                // WIN!
                playBeep(1200, 'sine', 1.0, 0.2);
                setTimeout(() => playBeep(1500, 'sine', 1.0, 0.2), 200);
                document.getElementById('win-modal').classList.remove('hidden');
            } else {
                // WRONG! Mark it off.
                wrongGuesses.add(currentInput);
                addBadgeToTracker(currentInput);
                setStatus("Incorrect Code", "text-beraverPink");
                playBeep(150, 'sawtooth', 0.4, 0.2);
                
                document.getElementById('tracker-count').innerText = `${wrongGuesses.size} / 10000 Marked Off`;
                
                // Visual shake effect
                const leftPanel = document.querySelector('section');
                leftPanel.classList.add('translate-x-2', 'border-beraverPink');
                leftPanel.classList.remove('border-beraverBlue');
                setTimeout(() => {
                    leftPanel.classList.remove('translate-x-2', 'border-beraverPink');
                    leftPanel.classList.add('border-beraverBlue');
                }, 150);

                currentInput = "";
                updateDisplay();
            }
        }

        // --- Tracker Grid Rendering ---
        function addBadgeToTracker(codeStr) {
            const firstDigit = codeStr[0]; // Determines the thousand block (0-9)
            const groupEl = document.getElementById(`group-${firstDigit}`);
            const badgesEl = document.getElementById(`badges-${firstDigit}`);
            
            // Un-hide the group if it's the first entry
            groupEl.classList.remove('hidden');

            // Create badge
            const badge = document.createElement('span');
            badge.className = "bg-beraverPink/20 border border-beraverPink px-2 py-1 rounded text-white text-sm font-mono tracking-widest shadow-[0_0_10px_rgba(255,0,127,0.2)]";
            badge.innerText = codeStr;
            
            // Insert and Sort visually (basic DOM append, sorted chronologically is fine, 
            // but for numerical sorting we can inject it based on string comparison).
            // Numerical sorting logic:
            const existingBadges = Array.from(badgesEl.children);
            let inserted = false;
            for (let i = 0; i < existingBadges.length; i++) {
                if (codeStr < existingBadges[i].innerText) {
                    badgesEl.insertBefore(badge, existingBadges[i]);
                    inserted = true;
                    break;
                }
            }
            if (!inserted) {
                badgesEl.appendChild(badge);
            }
        }

        function resetGame() {
            masterCode = "";
            currentInput = "";
            wrongGuesses.clear();
            
            updateDisplay();
            setStatus("Awaiting Input...", "text-gray-400");
            document.getElementById('tracker-count').innerText = "0 / 10000 Marked Off";
            initTrackerUI();
            
            document.getElementById('win-modal').classList.add('hidden');
            
            const setupInput = document.getElementById('master-code-input');
            setupInput.value = "";
            document.getElementById('setup-modal').classList.remove('hidden');
            setupInput.focus();
        }

        // --- Keyboard Support ---
        document.addEventListener('keydown', (e) => {
            // Only process if setup modal is hidden
            if (document.getElementById('setup-modal').classList.contains('hidden')) {
                if (e.key >= '0' && e.key <= '9') {
                    inputDigit(e.key);
                } else if (e.key === 'Backspace' || e.key === 'Delete') {
                    if (currentInput.length > 0) {
                        currentInput = currentInput.slice(0, -1);
                        playBeep(300, 'sawtooth', 0.1);
                        updateDisplay();
                    }
                } else if (e.key === 'Enter') {
                    submitGuess();
                } else if (e.key === 'Escape') {
                    clearInput();
                }
            } else if (e.key === 'Enter') {
                // If in setup mode, enter submits the master code
                lockSafe();
            }
        });

        // Focus master code input on load
        window.onload = () => {
            updateDisplay();
            document.getElementById('master-code-input').focus();
        };

    </script>
</body>
</html>
