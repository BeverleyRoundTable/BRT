<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>BERAVER Live Jukebox</title>
    
    <link rel="preload" href="https://brt-23f.pages.dev/site/Eurostile_Extended_2_Bold.woff2" as="font" type="font/woff2" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Eurostile', 'sans-serif'], 
                        body: ['Open Sans', 'sans-serif'],
                    },
                    colors: {
                        beraverBlue: '#4db8e8',
                        beraverPink: '#ff007f',
                        beraverDark: '#1D1D1A', 
                    }
                }
            }
        }
    </script>
    <style>
        @font-face {
            font-family: 'Eurostile';
            src: url('https://raw.githubusercontent.com/BeverleyRoundTable/BRT/main/site/Eurostile_Extended_2_Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        body {
            background-color: #1D1D1A;
            color: #FFFFFF;
        }
        
        .neon-text-blue { text-shadow: 0 0 10px rgba(77, 184, 232, 0.7), 0 0 20px rgba(77, 184, 232, 0.5); }
        .neon-text-pink { text-shadow: 0 0 10px rgba(255, 0, 127, 0.7), 0 0 20px rgba(255, 0, 127, 0.5); }

        /* Track Card Glass Effect */
        .track-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .track-card.playing {
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
            background: rgba(255, 0, 127, 0.05);
        }
        
        /* Audio Visualizer Bars */
        .bar {
            width: 4px;
            background-color: #ff007f;
            animation: bounce 1s infinite ease-in-out;
        }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.6s; }

        @keyframes bounce {
            0%, 100% { height: 8px; }
            50% { height: 24px; }
        }
    </style>
</head>
<body class="font-body antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full bg-beraverDark/95 backdrop-blur-sm border-b border-white/10 py-3 md:py-4">
        <div class="container mx-auto px-4 flex justify-between items-center gap-2">
            <div class="flex items-center gap-2 md:gap-3 min-w-0">
                <img src="https://brt-23f.pages.dev/icons/BRTLogo.png" alt="BRT Logo" class="w-8 h-8 md:w-10 md:h-10 object-contain flex-shrink-0">
                <div class="font-heading font-black text-sm md:text-xl tracking-tighter uppercase truncate">
                    BeRaver <span class="text-beraverPink neon-text-pink">Jukebox</span>
                </div>
            </div>
            
            <!-- Link directly to your Zeffy Form -->
            <a href="https://www.zeffy.com/en-GB/donation-form/beverley-round-tables-jukebox" target="_blank" class="font-heading uppercase font-bold text-xs md:text-sm text-beraverDark bg-beraverBlue px-4 py-2 md:px-6 md:py-2 rounded-full hover:bg-white transition-all duration-200 transform hover:scale-105 shadow-[0_0_15px_rgba(77,184,232,0.5)] whitespace-nowrap flex-shrink-0">
                Request<span class="hidden sm:inline"> a Track</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-12 max-w-3xl">
        
        <!-- Currently Playing -->
        <div class="mb-12">
            <h2 class="font-heading font-bold uppercase text-beraverPink tracking-widest text-sm mb-4">Now Playing</h2>
            
            <div class="track-card playing rounded-2xl p-4 flex items-center gap-6" id="now-playing-container">
                <img id="now-playing-img" src="/api/placeholder/80/80" alt="Album Art" class="w-20 h-20 rounded-lg shadow-lg hidden">
                <div class="flex-grow">
                    <h3 id="now-playing-title" class="font-heading font-black text-2xl text-white uppercase truncate">Loading...</h3>
                    <p id="now-playing-artist" class="text-gray-400 font-semibold text-lg truncate">Connecting to DJ Booth</p>
                </div>
                
                <!-- Visualizer -->
                <div class="flex items-end gap-1 h-8 px-2 hidden" id="visualizer">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
            </div>
        </div>

        <!-- Up Next (Queue) -->
        <div>
            <h2 class="font-heading font-bold uppercase text-beraverBlue tracking-widest text-sm mb-4">Up Next</h2>
            
            <div id="queue-container" class="space-y-3">
                <!-- Queue items will be injected here by JS -->
                <div class="text-center py-8 text-gray-500 font-semibold">
                    The queue is empty. Hit "Request a Track" to drop a banger!
                </div>
            </div>
        </div>

    </main>

    <!-- Live Donation Ticker (Identical to BERAVER main site) -->
    <section class="bg-black border-t border-white/10 py-4 relative z-20 overflow-hidden shadow-[0_-5px_20px_rgba(0,0,0,0.5)] mt-auto">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse shadow-[0_0_10px_red]"></div>
                <span class="font-heading font-bold uppercase tracking-widest text-sm text-gray-300">Live Webhook</span>
            </div>
            <div class="font-heading font-black text-2xl text-white transition-transform duration-300" id="total-raised-container">
                £<span id="total-raised">0</span> <span class="text-beraverBlue text-lg">Raised This Year</span>
            </div>
            <div id="latest-donation" class="text-sm font-bold h-6 overflow-hidden transition-opacity duration-300 text-gray-400">
                Listening for Zeffy drops...
            </div>
        </div>
    </section>

    <script>
        // --- ZEFFY WEBHOOK TICKER LOGIC ---
        const WORKER_URL = "https://zeffywebhook.beverley247.workers.dev";
        let totalRaised = 0;
        let lastDonationId = null;
        let isInitialLoad = true;
        const raisedEl = document.getElementById('total-raised');
        const raisedContainer = document.getElementById('total-raised-container');
        const latestEl = document.getElementById('latest-donation');

        function triggerDonationAlert(name, amount) {
            raisedEl.innerText = totalRaised;
            raisedContainer.classList.add('scale-110', 'text-beraverPink');
            setTimeout(() => raisedContainer.classList.remove('scale-110', 'text-beraverPink'), 400);
            latestEl.style.opacity = 0;
            setTimeout(() => {
                latestEl.innerHTML = `⚡ NEW: <span class="text-white">${name}</span> dropped <span class="text-beraverPink neon-text-pink">£${amount}</span>!`;
                latestEl.style.opacity = 1;
            }, 300);
        }

        async function pollLatestDonation() {
            try {
                const response = await fetch(WORKER_URL);
                if (!response.ok) return;
                const data = await response.json();
                if (typeof data.total === 'number') {
                    totalRaised = data.total;
                    raisedEl.innerText = totalRaised;
                }
                if (data.id && data.id !== lastDonationId) {
                    if (!isInitialLoad) triggerDonationAlert(data.name, data.amount);
                    lastDonationId = data.id; 
                }
                isInitialLoad = false;
            } catch (error) {}
        }
        setInterval(pollLatestDonation, 5000);
        pollLatestDonation(); 

        // --- SPOTIFY LIVE QUEUE LOGIC ---
        async function fetchLiveQueue() {
            try {
                const response = await fetch('https://zeffywebhook.beverley247.workers.dev/queue'); 
                const data = await response.json();
                
                // Update Now Playing
                if (data.currently_playing) {
                    document.getElementById('now-playing-title').innerText = data.currently_playing.name;
                    document.getElementById('now-playing-artist').innerText = data.currently_playing.artist;
                    document.getElementById('now-playing-img').src = data.currently_playing.image;
                    document.getElementById('now-playing-img').classList.remove('hidden');
                    document.getElementById('visualizer').classList.remove('hidden');
                }

                // Update Queue List
                const queueContainer = document.getElementById('queue-container');
                if (data.queue && data.queue.length > 0) {
                    queueContainer.innerHTML = '';
                    data.queue.slice(0, 5).forEach((track, index) => {
                        queueContainer.innerHTML += `
                            <div class="track-card rounded-xl p-3 flex items-center gap-4">
                                <div class="font-heading font-bold text-gray-500 w-6 text-center">${index + 1}</div>
                                <img src="${track.image}" alt="Art" class="w-12 h-12 rounded">
                                <div class="flex-grow min-w-0">
                                    <div class="font-bold text-white truncate">${track.name}</div>
                                    <div class="text-sm text-gray-400 truncate">${track.artist}</div>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                console.log("Waiting for queue data...");
            }
        }

        setInterval(fetchLiveQueue, 10000);
        fetchLiveQueue();
    </script>
</body>
</html>
