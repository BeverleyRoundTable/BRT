<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Partner Impact Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0d0d0b; color: #eaeae5; font-family: 'DM Sans', sans-serif; text-align: center; padding: 40px 20px; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: 64px; color: #FBAF33; letter-spacing: 2px; margin-bottom: 5px; }
    .subtitle { color: #a0a09a; font-size: 18px; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 900px; margin: 0 auto; }
    .card { background: #161614; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .card .number { font-family: 'Bebas Neue', sans-serif; font-size: 56px; color: #fff; line-height: 1; margin-bottom: 10px; }
    .card .number.gold { color: #FBAF33; }
    .card .label { font-size: 12px; color: rgba(255,255,255,0.4); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
  </style>
</head>
<body>

  <h1>Sponsor Impact</h1>
  <div class="subtitle" id="sponsorName">Loading Report...</div>

  <div class="grid" id="statsGrid" style="display:none;">
    <div class="card">
      <div class="number gold" id="valClicks">0</div>
      <div class="label">Direct Link Clicks</div>
    </div>
    <div class="card">
      <div class="number" id="valViews">0</div>
      <div class="label">Live Tracker Views</div>
    </div>
    <div class="card">
      <div class="number" id="valSocial">0</div>
      <div class="label">Total Social Reach</div>
    </div>
    <div class="card">
      <div class="number" style="font-size: 36px; padding-top:15px;" id="valDevice">0%</div>
      <div class="label">Mobile / Desktop Split</div>
    </div>
  </div>

  <script>
    // Extract parameters from the URL: ?api=YOUR_SCRIPT_URL&sponsor=Zendure
    const urlParams = new URLSearchParams(window.location.search);
    const api = urlParams.get('api');
    const sponsor = urlParams.get('sponsor') || 'Global Partner';

    document.getElementById('sponsorName').innerText = `${sponsor} x Santa Sleigh`;

    if (api) {
      fetch(`${api}?sponsor=${encodeURIComponent(sponsor)}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('valClicks').innerText = data.sponsorClicks.toLocaleString();
          document.getElementById('valViews').innerText = data.totalViews.toLocaleString();
          document.getElementById('valSocial').innerText = data.socialReach.toLocaleString();
          document.getElementById('valDevice').innerText = data.deviceSplit;
          document.getElementById('statsGrid').style.display = 'grid';
        })
        .catch(err => console.error("Error fetching data:", err));
    }
  </script>
</body>
</html>
