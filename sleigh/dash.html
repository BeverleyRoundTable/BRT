<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Santa - Spectator Dashboard</title>
    <style>
        /* CSS Reset & Setup */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050a15; /* Dashboard container dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none; /* Prevents pull-to-refresh & pinch zoom */
            user-select: none;
            -webkit-user-select: none;
        }

        /* Responsive scaling via CSS while maintaining a 3:4 aspect ratio */
        #gameCanvas {
            background-color: #0A192F; /* Deep night sky */
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 3 / 4;
            height: 100%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        /* Fallbacks to ensure the canvas shrinks appropriately on ultrawide or tall screens */
        @media (min-aspect-ratio: 3/4) {
            #gameCanvas { width: auto; height: 100vh; }
        }
        @media (max-aspect-ratio: 3/4) {
            #gameCanvas { width: 100vw; height: auto; }
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    /**
     * TURBO SANTA - Core Engine
     * Zero-dependency, GC-optimized HTML5 Canvas game.
     */
    
    // --- Configuration ---
    const GAME_WIDTH = 600;
    const GAME_HEIGHT = 800;
    
    // Core Elements
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // alpha:false optimizes the root canvas
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // --- Atlas & Pre-rendering ---
    // We create an off-screen canvas to hold all our text and emoji sprites.
    // This prevents the browser from re-rasterizing fonts/emojis at 60fps.
    const atlas = document.createElement('canvas');
    const actx = atlas.getContext('2d', { alpha: true });
    atlas.width = 1024;
    atlas.height = 1024;
    const sprites = {}; // Maps string ID to source {x, y, w, h} in the atlas

    function buildAtlas() {
        // Render Emojis (Row 0)
        actx.font = '80px sans-serif';
        actx.textBaseline = 'top';
        actx.fillText('🎅', 0, 0);   sprites.santa = {x: 0, y: 0, w: 90, h: 90};
        actx.fillText('🎁', 100, 0); sprites.present = {x: 100, y: 0, w: 90, h: 90};
        actx.fillText('🏠', 200, 0); sprites.house = {x: 200, y: 0, w: 90, h: 90};
        actx.fillText('❄️', 300, 0); sprites.snow = {x: 300, y: 0, w: 90, h: 90};
        actx.fillText('❤️', 400, 0); sprites.heart = {x: 400, y: 0, w: 90, h: 90};

        // Render Numbers 0-9 for the score (Row 1)
        actx.font = 'bold 50px sans-serif';
        actx.fillStyle = '#FFFFFF';
        for (let i = 0; i <= 9; i++) {
            let str = i.toString();
            let w = actx.measureText(str).width;
            actx.fillText(str, i * 60, 100);
            sprites['n' + i] = {x: i * 60, y: 100, w: Math.ceil(w), h: 60};
        }

        // Render Static UI Text
        actx.font = 'bold 64px sans-serif';
        sprites.title = addAtlasText('TURBO SANTA', '#FFCC00', 0, 200);
        
        actx.font = 'bold 36px sans-serif';
        sprites.tap = addAtlasText('TAP TO DROP', '#FFFFFF', 0, 300);
        
        actx.font = 'bold 64px sans-serif';
        sprites.over = addAtlasText('GAME OVER', '#FF4444', 0, 400);
        
        actx.font = 'italic 24px sans-serif';
        sprites.easter = addAtlasText('Delivering smiles since 1950', '#88BBDD', 0, 500); // Easter egg
        
        actx.font = 'bold 30px sans-serif';
        sprites.scoreLbl = addAtlasText('SCORE:', '#FFFFFF', 0, 600);
    }

    // Helper to measure, draw, and save text coordinates in the atlas
    function addAtlasText(text, color, x, y) {
        actx.fillStyle = color;
        let metrics = actx.measureText(text);
        let w = Math.ceil(metrics.width);
        // Approximation of height since measureText height isn't uniformly supported in old browsers
        let h = parseInt(actx.font, 10) * 1.3; 
        actx.fillText(text, x, y);
        return {x: x, y: y, w: w, h: h};
    }

    // --- Game State & Object Pools ---
    // Avoid dynamic allocations (`new` / `[]`) in the game loop to prevent GC drops.
    let state = 'MENU'; // 'MENU', 'PLAY', 'OVER'
    let score = 0;
    let lives = 3;

    // Entity: Santa
    const santa = {x: 250, y: 50, w: 80, h: 80, speed: 4.5, dir: 1};

    // Pool: Presents (Max 5 on screen at once)
    const MAX_PRESENTS = 5;
    const presents = [];
    for(let i=0; i<MAX_PRESENTS; i++) presents.push({active: false, x: 0, y: 0, w: 40, h: 40});

    // Pool: Snowflakes (Visuals only)
    const MAX_SNOW = 40;
    const snow = [];
    for(let i=0; i<MAX_SNOW; i++) {
        snow.push({
            x: Math.random() * GAME_WIDTH, 
            y: Math.random() * GAME_HEIGHT, 
            speed: Math.random() * 2 + 1,
            size: Math.random() * 10 + 15
        });
    }

    // Entities: Chimneys (Different sizes/speeds/multipliers for replayability)
    const chimneys = [
        {x: 50,  y: 600, w: 100, h: 200, speed: 2.0, dir: 1,  mult: 1}, // Easy
        {x: 250, y: 640, w: 70,  h: 160, speed: 3.5, dir: -1, mult: 2}, // Harder
        {x: 450, y: 580, w: 120, h: 220, speed: 1.5, dir: 1,  mult: 1}  // Slow/Wide
    ];

    function resetGame() {
        score = 0;
        lives = 3;
        santa.x = GAME_WIDTH / 2 - santa.w / 2;
        santa.speed = 4.5;
        for(let i=0; i<MAX_PRESENTS; i++) presents[i].active = false;
        
        // Reset chimney speeds
        chimneys[0].speed = 2.0;
        chimneys[1].speed = 3.5;
        chimneys[2].speed = 1.5;
    }

    // --- Input Handling ---
    function handleTap() {
        if (state === 'MENU' || state === 'OVER') {
            resetGame();
            state = 'PLAY';
            return;
        }

        if (state === 'PLAY') {
            // Find first inactive present in the pool and drop it
            for (let i = 0; i < MAX_PRESENTS; i++) {
                if (!presents[i].active) {
                    presents[i].active = true;
                    // Center under Santa
                    presents[i].x = santa.x + (santa.w / 2) - (presents[i].w / 2);
                    presents[i].y = santa.y + santa.h - 10;
                    break;
                }
            }
        }
    }

    // Bind both touch and mouse, prevent defaults to disable scrolling/zooming
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(); }, {passive: false});
    canvas.addEventListener('mousedown', (e) => { e.preventDefault(); handleTap(); });

    // --- Game Logic ---
    function update() {
        if (state !== 'PLAY') return;

        // Update Santa
        santa.x += santa.speed * santa.dir;
        if (santa.x < 0) { santa.x = 0; santa.dir = 1; }
        if (santa.x + santa.w > GAME_WIDTH) { santa.x = GAME_WIDTH - santa.w; santa.dir = -1; }

        // Update Chimneys
        for (let i = 0; i < chimneys.length; i++) {
            let c = chimneys[i];
            c.x += c.speed * c.dir;
            if (c.x < 0) { c.x = 0; c.dir = 1; }
            if (c.x + c.w > GAME_WIDTH) { c.x = GAME_WIDTH - c.w; c.dir = -1; }
        }

        // Update Presents & Collisions
        for (let i = 0; i < MAX_PRESENTS; i++) {
            let p = presents[i];
            if (!p.active) continue;

            p.y += 10; // Fall speed

            // Check collision with chimneys
            let caught = false;
            for (let j = 0; j < chimneys.length; j++) {
                let c = chimneys[j];
                // Present bottom crosses the top lip of the chimney
                if (p.y + p.h >= c.y && p.y + p.h <= c.y + 20) {
                    // Check if horizontal center of present falls within chimney bounds
                    let pCenter = p.x + p.w / 2;
                    if (pCenter > c.x && pCenter < c.x + c.w) {
                        caught = true;
                        p.active = false;
                        score += c.mult;
                        
                        // Increase difficulty slightly over time
                        santa.speed = Math.min(10, santa.speed + 0.15);
                        c.speed += 0.1;
                        break;
                    }
                }
            }

            // Present fell past the bottom of the screen completely
            if (!caught && p.y > GAME_HEIGHT) {
                p.active = false;
                lives--;
                if (lives <= 0) state = 'OVER';
            }
        }
    }

    // --- Rendering Logic ---
    // Helper to draw pre-rendered sprites safely and blazingly fast using Bitwise OR `| 0` 
    // to strip float values. Avoids sub-pixel anti-aliasing overhead.
    function drawSprite(sprite, dx, dy, dw, dh) {
        if (!sprite) return;
        ctx.drawImage(atlas, sprite.x, sprite.y, sprite.w, sprite.h, dx | 0, dy | 0, dw | 0, dh | 0);
    }

    function drawNumber(num, x, y) {
        let str = num.toString();
        let curX = x;
        for (let i = 0; i < str.length; i++) {
            let s = sprites['n' + str[i]];
            if (s) {
                drawSprite(s, curX, y, s.w, s.h);
                curX += s.w + 2;
            }
        }
    }

    function render() {
        // Clear background
        ctx.fillStyle = '#0A192F';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Render Snow (runs constantly for ambiance)
        for (let i = 0; i < MAX_SNOW; i++) {
            let s = snow[i];
            s.y += s.speed;
            if (s.y > GAME_HEIGHT) s.y = -s.size; // Wrap around
            drawSprite(sprites.snow, s.x, s.y, s.size, s.size);
        }

        // Render Chimneys and Houses
        for (let i = 0; i < chimneys.length; i++) {
            let c = chimneys[i];
            // Procedural Brick Base
            ctx.fillStyle = '#6A1111';
            ctx.fillRect(c.x | 0, c.y | 0, c.w | 0, c.h | 0);
            ctx.fillStyle = '#8B1A1A';
            ctx.fillRect((c.x + 5) | 0, c.y | 0, (c.w - 10) | 0, c.h | 0);
            
            // House emoji at the bottom of the chimney for visual storytelling!
            drawSprite(sprites.house, c.x + (c.w / 2) - 40, c.y + c.h - 80, 80, 80);
        }

        // Render Presents
        for (let i = 0; i < MAX_PRESENTS; i++) {
            if (presents[i].active) {
                drawSprite(sprites.present, presents[i].x, presents[i].y, presents[i].w, presents[i].h);
            }
        }

        // Render Santa
        drawSprite(sprites.santa, santa.x, santa.y, santa.w, santa.h);

        // Render UI
        if (state === 'PLAY' || state === 'OVER') {
            drawSprite(sprites.scoreLbl, 10, 10, sprites.scoreLbl.w, sprites.scoreLbl.h);
            drawNumber(score, 10 + sprites.scoreLbl.w + 10, 10);
            
            // Draw life hearts
            for (let i = 0; i < lives; i++) {
                drawSprite(sprites.heart, GAME_WIDTH - 40 - (i * 40), 10, 30, 30);
            }
        }

        // Menu & Game Over Screens
        if (state === 'MENU') {
            ctx.fillStyle = 'rgba(10, 25, 47, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            drawSprite(sprites.title, (GAME_WIDTH/2 - sprites.title.w/2), 250, sprites.title.w, sprites.title.h);
            drawSprite(sprites.tap, (GAME_WIDTH/2 - sprites.tap.w/2), 400, sprites.tap.w, sprites.tap.h);
            drawSprite(sprites.easter, (GAME_WIDTH/2 - sprites.easter.w/2), GAME_HEIGHT - 50, sprites.easter.w, sprites.easter.h);
        }

        if (state === 'OVER') {
            ctx.fillStyle = 'rgba(10, 25, 47, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            drawSprite(sprites.over, (GAME_WIDTH/2 - sprites.over.w/2), 250, sprites.over.w, sprites.over.h);
            drawSprite(sprites.tap, (GAME_WIDTH/2 - sprites.tap.w/2), 400, sprites.tap.w, sprites.tap.h);
            drawSprite(sprites.easter, (GAME_WIDTH/2 - sprites.easter.w/2), GAME_HEIGHT - 50, sprites.easter.w, sprites.easter.h);
        }
    }

    // --- Main Game Loop ---
    function loop() {
        update();
        render();
        requestAnimationFrame(loop);
    }

    // Initialize atlas then bootstrap loop
    buildAtlas();
    requestAnimationFrame(loop);

</script>
</body>
</html>
