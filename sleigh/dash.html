<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Santa - Chimney Drop</title>
    <style>
        /* CSS reset and container setup for responsive canvas */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1b2a; /* Night sky background */
            overflow: hidden; /* Prevent scrolling */
            touch-action: none; /* Prevent default touch actions like pull-to-refresh */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            width: 100%;
            max-width: 600px; /* Lock aspect ratio on larger screens */
            height: 100%;
            max-height: 900px;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Scale canvas cleanly to fit */
            image-rendering: pixelated; /* Crisp rendering */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        /**
         * TURBO SANTA: CHIMNEY DROP
         * 
         * An optimized HTML5 Canvas game.
         * Features:
         * - Object Pooling for all entities (no GC stutter)
         * - Off-screen Canvas pre-rendering for sprites and text
         * - Bitwise integer coercion for rendering coords
         * - Touch-first mobile design
         */

        // --- CONSTANTS & CONFIG ---
        const GAME_WIDTH = 400;
        const GAME_HEIGHT = 600;
        const FPS = 60;
        const FRAME_TIME = 1000 / FPS;

        const STATE_MENU = 0;
        const STATE_PLAYING = 1;
        const STATE_GAMEOVER = 2;

        // --- GLOBAL VARIABLES ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize by disabling alpha background
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        let gameState = STATE_MENU;
        let score = 0;
        let lives = 3;
        let lastTime = 0;
        let accumulator = 0;

        // Pre-rendered asset dictionaries
        const sprites = {};
        const textSprites = {};
        const digits = [];

        // --- OFF-SCREEN RENDERING UTILITIES ---

        // Pre-renders an emoji to an off-screen canvas
        function renderEmoji(emoji, size) {
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const cx = c.getContext('2d');
            cx.font = `${size * 0.8}px sans-serif`;
            cx.textAlign = 'center';
            cx.textBaseline = 'middle';
            // Draw slightly offset to center perfectly
            cx.fillText(emoji, size / 2 | 0, (size / 2 + size * 0.05) | 0);
            return c;
        }

        // Pre-renders text to an off-screen canvas to avoid text rendering in game loop
        function renderText(text, size, color, isBold = true) {
            const c = document.createElement('canvas');
            const cx = c.getContext('2d');
            const fontStr = `${isBold ? 'bold ' : ''}${size}px sans-serif`;
            cx.font = fontStr;
            const metrics = cx.measureText(text);
            c.width = Math.ceil(metrics.width) + 4;
            c.height = size + 10;
            cx.font = fontStr; // Re-apply font after resize
            cx.fillStyle = color;
            cx.textBaseline = 'top';
            cx.fillText(text, 2, 2);
            return c;
        }

        // Procedurally generate a brick chimney sprite off-screen
        function renderChimney(width, height) {
            const c = document.createElement('canvas');
            c.width = width;
            c.height = height;
            const cx = c.getContext('2d');
            
            // Base brick color
            cx.fillStyle = '#b22222';
            cx.fillRect(0, 0, width, height);
            
            // Draw brick mortar lines
            cx.fillStyle = '#000000';
            for (let y = 0; y < height; y += 15) {
                cx.fillRect(0, y, width, 2); // Horizontal lines
                const offset = (y % 30 === 0) ? 0 : 15;
                for (let x = offset; x < width; x += 30) {
                    cx.fillRect(x, y, 2, 15); // Vertical lines
                }
            }

            // Top rim / opening
            cx.fillStyle = '#333333';
            cx.fillRect(-2, 0, width + 4, 12); // Flange
            cx.fillStyle = '#111111';
            cx.fillRect(4, 0, width - 8, 8); // Hole

            // Snow on top rim
            cx.fillStyle = '#ffffff';
            cx.fillRect(0, 0, width, 4);
            cx.fillRect(0, 4, 10, 3);
            cx.fillRect(width - 10, 4, 10, 3);

            return c;
        }

        // Pre-render night sky gradient background
        function renderBackground() {
            const c = document.createElement('canvas');
            c.width = GAME_WIDTH;
            c.height = GAME_HEIGHT;
            const cx = c.getContext('2d');
            const grad = cx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            grad.addColorStop(0, '#000022');
            grad.addColorStop(1, '#1a3a5c');
            cx.fillStyle = grad;
            cx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // Draw some static moon/stars
            cx.fillStyle = '#ffffe0';
            cx.beginPath();
            cx.arc(320, 80, 40, 0, Math.PI * 2);
            cx.fill();
            
            // Craters
            cx.fillStyle = '#e6e6cc';
            cx.beginPath(); cx.arc(310, 70, 10, 0, Math.PI * 2); cx.fill();
            cx.beginPath(); cx.arc(335, 95, 8, 0, Math.PI * 2); cx.fill();

            return c;
        }

        function initAssets() {
            // Entities
            sprites.santa = renderEmoji('🎅', 60);
            sprites.present = renderEmoji('🎁', 30);
            sprites.heart = renderEmoji('❤️', 24);
            sprites.emptyHeart = renderEmoji('🖤', 24);
            sprites.chimney = renderChimney(60, 80);
            sprites.chimneySmall = renderChimney(45, 60);
            sprites.bg = renderBackground();

            // Text and UI Strings
            textSprites.title1 = renderText('TURBO', 48, '#ffffff');
            textSprites.title2 = renderText('SANTA', 64, '#ff3333');
            textSprites.tapToStart = renderText('Tap to Start!', 24, '#ffff00');
            textSprites.gameOver = renderText('GAME OVER', 48, '#ff3333');
            textSprites.tapToRestart = renderText('Tap to Restart', 24, '#ffffff');
            textSprites.score = renderText('Score: ', 24, '#ffffff');
            textSprites.lore = renderText('Delivering smiles since 1927', 16, '#aaaaaa', false);
            textSprites.instructions = renderText('Tap to drop presents into chimneys!', 18, '#ffffff', false);

            // Digits 0-9 for dynamic score display
            for (let i = 0; i < 10; i++) {
                digits[i] = renderText(i.toString(), 24, '#ffff00');
            }
        }

        // --- OBJECT POOLS (Preventing GC Stutter) ---

        const poolSize = {
            snow: 50,
            presents: 10,
            chimneys: 4
        };

        const snowPool = Array.from({ length: poolSize.snow }, () => ({
            x: 0, y: 0, speed: 0, size: 0, active: false
        }));

        const presentPool = Array.from({ length: poolSize.presents }, () => ({
            x: 0, y: 0, vy: 0, active: false
        }));

        const chimneyPool = Array.from({ length: poolSize.chimneys }, () => ({
            x: 0, y: 0, vx: 0, w: 0, h: 0, sprite: null, active: false
        }));

        const santa = {
            x: GAME_WIDTH / 2,
            y: 50,
            w: 60,
            h: 60,
            vx: 2 // SLOWED DOWN: Was 3, now 2 for easier tracking
        };

        // --- GAME LOGIC ---

        function spawnSnow() {
            for (let i = 0; i < snowPool.length; i++) {
                const s = snowPool[i];
                s.x = (Math.random() * GAME_WIDTH) | 0;
                s.y = (Math.random() * GAME_HEIGHT) | 0;
                s.speed = (Math.random() * 1.5 + 0.5);
                s.size = (Math.random() * 3 + 1) | 0;
                s.active = true;
            }
        }

        function spawnChimney() {
            // Find inactive chimney
            for (let i = 0; i < chimneyPool.length; i++) {
                const c = chimneyPool[i];
                if (!c.active) {
                    const isSmall = Math.random() > 0.6;
                    c.w = isSmall ? 45 : 60;
                    c.h = isSmall ? 60 : 80;
                    c.sprite = isSmall ? sprites.chimneySmall : sprites.chimney;
                    
                    // Start offscreen left or right
                    const fromLeft = Math.random() > 0.5;
                    c.x = fromLeft ? -c.w : GAME_WIDTH;
                    c.y = GAME_HEIGHT - c.h;
                    
                    // SLOWED DOWN: Base speed lowered, and score-speed multiplier cut in half
                    const speed = 1.0 + (Math.random() * 0.5) + (score * 0.005);
                    c.vx = fromLeft ? speed : -speed;
                    
                    c.active = true;
                    break;
                }
            }
        }

        function dropPresent() {
            if (gameState !== STATE_PLAYING) return;
            
            // Find inactive present
            for (let i = 0; i < presentPool.length; i++) {
                const p = presentPool[i];
                if (!p.active) {
                    p.x = santa.x + (santa.w / 2) - 15 | 0;
                    p.y = santa.y + 40;
                    p.vy = 0;
                    p.active = true;
                    break;
                }
            }
        }

        function resetGame() {
            score = 0;
            lives = 3;
            santa.x = GAME_WIDTH / 2;
            santa.vx = 2; // SLOWED DOWN reset speed
            
            for (let i = 0; i < presentPool.length; i++) presentPool[i].active = false;
            for (let i = 0; i < chimneyPool.length; i++) chimneyPool[i].active = false;
            
            spawnChimney();
        }

        // --- UPDATE LOOP ---

        function update() {
            // Update Snow
            for (let i = 0; i < snowPool.length; i++) {
                const s = snowPool[i];
                if (s.active) {
                    s.y += s.speed;
                    if (s.y > GAME_HEIGHT) {
                        s.y = 0;
                        s.x = (Math.random() * GAME_WIDTH) | 0;
                    }
                }
            }

            if (gameState === STATE_PLAYING) {
                // Update Santa
                santa.x += santa.vx;
                // Bounce off walls
                if (santa.x <= 0 || santa.x + santa.w >= GAME_WIDTH) {
                    santa.vx *= -1;
                    // Keep within bounds
                    santa.x = santa.x <= 0 ? 0 : GAME_WIDTH - santa.w;
                }

                // Update Presents
                for (let i = 0; i < presentPool.length; i++) {
                    const p = presentPool[i];
                    if (p.active) {
                        p.vy += 0.15; // SLOWED DOWN: Lower gravity (was 0.2)
                        p.y += p.vy;

                        // Check collision with chimneys
                        let caught = false;
                        for (let j = 0; j < chimneyPool.length; j++) {
                            const c = chimneyPool[j];
                            if (c.active) {
                                // FORGIVING HITBOX: Expanded the detection zone slightly for kids
                                if (p.y + 30 > c.y - 5 && p.y + 15 < c.y + 20 && 
                                    p.x + 25 > c.x - 5 && p.x + 5 < c.x + c.w + 5) {
                                    
                                    // Caught present!
                                    score += c.w === 45 ? 20 : 10; // More points for small chimneys
                                    p.active = false;
                                    caught = true;
                                    break; 
                                }
                            }
                        }

                        // Missed / Hit ground
                        if (!caught && p.y > GAME_HEIGHT) {
                            p.active = false;
                            lives--;
                            if (lives <= 0) {
                                gameState = STATE_GAMEOVER;
                            }
                        }
                    }
                }

                // Update Chimneys
                let activeChimneys = 0;
                for (let i = 0; i < chimneyPool.length; i++) {
                    const c = chimneyPool[i];
                    if (c.active) {
                        activeChimneys++;
                        c.x += c.vx;
                        // Deactivate if off screen
                        if ((c.vx < 0 && c.x + c.w < -20) || (c.vx > 0 && c.x > GAME_WIDTH + 20)) {
                            c.active = false;
                        }
                    }
                }

                // Randomly spawn new chimneys (Slightly reduced spawn rate)
                if (activeChimneys < poolSize.chimneys && Math.random() < 0.015) {
                    spawnChimney();
                }
            }
        }

        // --- RENDER LOOP ---

        // Helper to draw pre-rendered text at specific coords using integer cast
        function drawPreRendered(sprite, x, y) {
            ctx.drawImage(sprite, x | 0, y | 0);
        }

        function drawScoreNumber(num, x, y) {
            const numStr = num.toString();
            let cursorX = x | 0;
            for (let i = 0; i < numStr.length; i++) {
                const digit = parseInt(numStr[i]);
                const sprite = digits[digit];
                ctx.drawImage(sprite, cursorX, y | 0);
                cursorX += sprite.width - 2; // slightly compact spacing
            }
        }

        function draw() {
            // Draw background
            drawPreRendered(sprites.bg, 0, 0);

            // Draw Snow (Direct canvas commands are cheap for simple rects)
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < snowPool.length; i++) {
                const s = snowPool[i];
                if (s.active) {
                    ctx.fillRect(s.x | 0, s.y | 0, s.size | 0, s.size | 0);
                }
            }

            // Draw Chimneys
            for (let i = 0; i < chimneyPool.length; i++) {
                const c = chimneyPool[i];
                if (c.active) {
                    drawPreRendered(c.sprite, c.x, c.y);
                }
            }

            // Draw Presents
            for (let i = 0; i < presentPool.length; i++) {
                const p = presentPool[i];
                if (p.active) {
                    drawPreRendered(sprites.present, p.x, p.y);
                }
            }

            // Draw Santa
            if (gameState === STATE_PLAYING || gameState === STATE_GAMEOVER) {
                drawPreRendered(sprites.santa, santa.x, santa.y);
            }

            // UI Layer
            if (gameState === STATE_MENU) {
                // Title
                drawPreRendered(textSprites.title1, (GAME_WIDTH - textSprites.title1.width) / 2, 120);
                drawPreRendered(textSprites.title2, (GAME_WIDTH - textSprites.title2.width) / 2, 180);
                
                // Instructions
                drawPreRendered(textSprites.instructions, (GAME_WIDTH - textSprites.instructions.width) / 2, 280);
                
                // Tap to start
                // Blinking effect
                if (Math.floor(Date.now() / 500) % 2 === 0) {
                    drawPreRendered(textSprites.tapToStart, (GAME_WIDTH - textSprites.tapToStart.width) / 2, 400);
                }

                // Lore
                drawPreRendered(textSprites.lore, (GAME_WIDTH - textSprites.lore.width) / 2, GAME_HEIGHT - 30);

            } else if (gameState === STATE_PLAYING) {
                // Score
                drawPreRendered(textSprites.score, 10, 10);
                drawScoreNumber(score, 10 + textSprites.score.width, 10);

                // Lives (Hearts)
                for (let i = 0; i < 3; i++) {
                    const hSprite = i < lives ? sprites.heart : sprites.emptyHeart;
                    drawPreRendered(hSprite, GAME_WIDTH - 35 - (i * 30), 10);
                }

            } else if (gameState === STATE_GAMEOVER) {
                // Game Over Screen
                drawPreRendered(textSprites.gameOver, (GAME_WIDTH - textSprites.gameOver.width) / 2, 200);
                
                drawPreRendered(textSprites.score, (GAME_WIDTH - textSprites.score.width) / 2 - 20, 280);
                drawScoreNumber(score, (GAME_WIDTH / 2) + 20, 280);

                if (Math.floor(Date.now() / 500) % 2 === 0) {
                    drawPreRendered(textSprites.tapToRestart, (GAME_WIDTH - textSprites.tapToRestart.width) / 2, 400);
                }

                drawPreRendered(textSprites.lore, (GAME_WIDTH - textSprites.lore.width) / 2, GAME_HEIGHT - 30);
            }
        }

        // --- CORE GAME LOOP (Fixed Timestep) ---

        function loop(timestamp) {
            let deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // Cap delta time to prevent spiral of death if tab is inactive
            if (deltaTime > 250) deltaTime = 250;

            accumulator += deltaTime;

            while (accumulator >= FRAME_TIME) {
                update();
                accumulator -= FRAME_TIME;
            }

            draw();
            requestAnimationFrame(loop);
        }

        // --- INPUT HANDLING ---

        function handleInput(e) {
            e.preventDefault(); // Prevents zooming and scrolling on touch devices
            
            if (gameState === STATE_MENU) {
                gameState = STATE_PLAYING;
                resetGame();
            } else if (gameState === STATE_PLAYING) {
                dropPresent();
            } else if (gameState === STATE_GAMEOVER) {
                // Small delay to prevent accidental instant restart
                gameState = STATE_MENU;
            }
        }

        // Event listeners (handling both mouse and touch)
        canvas.addEventListener('mousedown', handleInput, { passive: false });
        canvas.addEventListener('touchstart', handleInput, { passive: false });

        // --- BOOT ---
        window.onload = () => {
            initAssets();
            spawnSnow();
            lastTime = performance.now();
            requestAnimationFrame(loop);
        };

    </script>
</body>
</html>
