<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleigh Blueprint</title>
  
  <!-- Import Official Round Table Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* --- BRAND VARIABLES --- */
    :root {
      --primary: #FBAF33; /* Golden Yellow */
      --accent: #FFFFFF; /* White */
      --bg-dark: #1D1D1A; /* Table Grey */
      --bg-card: #000000; /* Black */
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.7);
      --border: rgba(255, 255, 255, 0.15);
    }

    /* --- CORE STYLES --- */
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-dark);
      font-family: 'Open Sans', sans-serif;
      color: var(--text-main);
    }

    .blueprint-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* --- INSTRUCTION BANNER --- */
    #live-stats-banner {
      background: rgba(251, 175, 51, 0.1);
      color: var(--primary);
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(251, 175, 51, 0.3);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    #live-stats-banner strong {
      color: var(--accent);
    }

    /* --- MAP & IMAGE --- */
    .sleigh-map {
      position: relative;
      width: 100%;
      background: var(--bg-card); 
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }

    .base-image {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0.9;
    }

    /* --- GAMIFIED HOTSPOTS --- */
    .hotspot {
      position: absolute;
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      box-shadow: 0 0 10px var(--primary);
      transition: all 0.3s ease;
      z-index: 10;
      touch-action: manipulation;
    }

    /* Radar Pulse Animation */
    .hotspot::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      background: var(--primary);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 2s infinite cubic-bezier(0.165, 0.84, 0.44, 1);
      z-index: -1;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
    }

    /* Active & Hover States using Brand White */
    .hotspot:hover, .active-dot {
      background: var(--accent);
      box-shadow: 0 0 20px var(--accent);
    }
    .active-dot::before {
      background: var(--accent);
    }

    /* --- INFO PANEL (DARK MODE) --- */
    .info-panel {
      background: var(--bg-card);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      border-left: 5px solid var(--primary);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      min-height: 120px;
    }

    #panel-title {
      margin: 0 0 5px 0;
      font-size: 1.5rem;
      font-family: 'Eurostile Extended Bold', 'Eurostile', 'Open Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .highlight-text {
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 15px 0;
      font-size: 0.9rem;
      font-weight: 700;
    }

    #panel-desc {
      margin: 0;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .fade-in {
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="blueprint-container">
    
    <!-- Family-friendly instruction banner -->
    <div id="live-stats-banner">
      ✨ <strong>Inside Santa's Workshop:</strong> Tap the glowing dots on the sleigh to see the magic under the hood!
    </div>

    <!-- The Visual Map -->
    <div class="sleigh-map">
      <!-- Using the raw GitHub user content URL -->
      <img src="https://raw.githubusercontent.com/BeverleyRoundTable/BRT/main/icons/sleigh-wireframe.png" alt="Santa Sleigh Blueprint" class="base-image" id="sleigh-image">
      
      <!-- Hotspots mapped for 16:9 Landscape Layout -->
      <div class="hotspot" style="top: 60%; left: 70%;" data-id="power"></div>
      <div class="hotspot" style="top: 45%; left: 82%;" data-id="audio"></div>
      <div class="hotspot" style="top: 25%; left: 45%;" data-id="lighting"></div>
      <!-- Chassis is default active on load -->
      <div class="hotspot active-dot" style="top: 75%; left: 50%;" data-id="chassis"></div>
    </div>

    <!-- The Sponsor Info Panel (Starts on Chassis) -->
    <div class="info-panel" id="sponsor-panel">
      <div class="panel-content">
        <h3 id="panel-title">The Sleigh Base</h3>
        <h4 id="panel-sponsor" class="highlight-text">Mahindra Treo Platform</h4>
        <p id="panel-desc">A fully electric, zero-emission foundation wrapped in festive magic, keeping the route green and environmentally friendly.</p>
      </div>
    </div>

  </div>

  <script>
    // =========================================================================
    // 1. YOUR WEB APP URL (Site Analytics / Hub for silent logging)
    // =========================================================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwyAk3IScj--iNDQUn0ddk5wUH99Gfh6kPnCGmxgHhb4dIOoPRGaRwGT1lD-E9jf8dv/exec"; 

    // =========================================================================
    // 2. COMPONENT DATABASE
    // =========================================================================
    const sleighComponents = {
      chassis: {
        title: "The Sleigh Base",
        sponsor: "Mahindra Treo Platform",
        desc: "A fully electric, zero-emission foundation wrapped in festive magic, keeping the route green and environmentally friendly.",
        logLabel: "Blueprint_Tap_Chassis"
      },
      power: {
        title: "The Magic Core",
        sponsor: "Official Power Partner: Zendure",
        desc: "Super power packs to make the sleigh sparkle! These SolarFlow stations provide clean, silent energy to keep Santa glowing all night long without noisy generators.",
        logLabel: "Blueprint_Tap_Zendure" 
      },
      audio: {
        title: "Sleigh Bells & Bass",
        sponsor: "Audio by JBL",
        desc: "Linked PartyBox speakers pushing booming Christmas anthems through the streets, making sure you hear Santa before you see him.",
        logLabel: "Blueprint_Tap_JBL"
      },
      lighting: {
        title: "Dynamic Illuminations",
        sponsor: "Powered by Govee",
        desc: "Thousands of smart LEDs mapped across the modular aluminum frame, capable of snowfall effects and reacting live to the music.",
        logLabel: "Blueprint_Tap_Govee"
      }
    };

    // =========================================================================
    // 3. INTERACTION LOGIC & SILENT LOGGING (DATA IN)
    // =========================================================================
    const hotspots = document.querySelectorAll('.hotspot');
    const panelTitle = document.getElementById('panel-title');
    const panelSponsor = document.getElementById('panel-sponsor');
    const panelDesc = document.getElementById('panel-desc');
    infoPanel = document.getElementById('sponsor-panel');

    hotspots.forEach(dot => {
      dot.addEventListener('click', (e) => {
        hotspots.forEach(h => h.classList.remove('active-dot'));
        e.target.classList.add('active-dot');

        const id = e.target.getAttribute('data-id');
        const data = sleighComponents[id];

        infoPanel.classList.remove('fade-in');
        void infoPanel.offsetWidth; 
        
        panelTitle.textContent = data.title;
        panelSponsor.textContent = data.sponsor;
        panelDesc.textContent = data.desc;
        
        infoPanel.classList.add('fade-in');

        // Silently log the click to Google Sheets for your backend reporting
        if(WEB_APP_URL !== "") {
          fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ sponsorName: data.logLabel })
          }).catch(err => console.error("Tracking failed"));
        }
      });
    });

    // =========================================================================
    // 4. DEV TOOL: COORDINATE FINDER 
    // =========================================================================
    /*
    document.getElementById('sleigh-image').addEventListener('click', function(e) {
      const rect = e.target.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      
      console.log(`Copy this into your HTML hotspot element:`);
      console.log(`style="top: ${y.toFixed(2)}%; left: ${x.toFixed(2)}%;"`);
    });
    */
  </script>

  <script>
  function sendHeight() {
    const height = document.documentElement.scrollHeight;
    window.parent.postMessage({ frameHeight: height }, '*');
  }
  
  // Send height when page loads
  window.addEventListener('load', sendHeight);
  
  // Send height if window resizes (desktop to mobile transitions)
  window.addEventListener('resize', sendHeight);
  
  // Send height when a hotspot is clicked (in case text changes panel size)
  document.querySelectorAll('.hotspot').forEach(dot => {
    dot.addEventListener('click', () => {
      setTimeout(sendHeight, 50); // slight delay to allow new text to render
    });
  });
</script>

</body>
</html>
