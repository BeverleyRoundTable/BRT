<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleigh Blueprint & Live Stats</title>
  <style>
    /* --- CORE STYLES --- */
    body {
      margin: 0;
      padding: 20px;
      background-color: #0f0f1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }

    .blueprint-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* --- LIVE STATS BANNER --- */
    #live-stats-banner {
      background: rgba(251, 175, 51, 0.1);
      color: #FBAF33;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(251, 175, 51, 0.3);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    #live-stats-banner strong {
      color: #fff;
    }

    /* --- MAP & IMAGE --- */
    .sleigh-map {
      position: relative;
      width: 100%;
      background: #1a1a2e; 
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .base-image {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0.9;
    }

    /* --- GAMIFIED HOTSPOTS --- */
    .hotspot {
      position: absolute;
      width: 24px;
      height: 24px;
      background: #ffaa00;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      box-shadow: 0 0 10px #ffaa00;
      transition: all 0.3s ease;
      z-index: 10;
      touch-action: manipulation;
    }

    /* Radar Pulse Animation */
    .hotspot::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      background: #ffaa00;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 2s infinite cubic-bezier(0.165, 0.84, 0.44, 1);
      z-index: -1;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
    }

    .hotspot:hover, .active-dot {
      background: #ff3333;
      box-shadow: 0 0 20px #ff3333;
    }
    .active-dot::before {
      background: #ff3333;
    }

    /* --- INFO PANEL --- */
    .info-panel {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-left: 5px solid #ffaa00;
      min-height: 120px;
    }

    #panel-title {
      margin: 0 0 5px 0;
      font-size: 1.5rem;
    }

    .highlight-text {
      color: #ffaa00;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 15px 0;
      font-size: 0.9rem;
      font-weight: 700;
    }

    #panel-desc {
      margin: 0;
      line-height: 1.5;
      color: #555;
    }

    .fade-in {
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="blueprint-container">
    
    <!-- Live Stats Banner (Populated via Apps Script) -->
    <div id="live-stats-banner">
      Connecting to Santa's radar...
    </div>

    <!-- The Visual Map -->
    <div class="sleigh-map">
      <!-- Using the raw GitHub user content URL so the image loads correctly within the web app -->
      <img src="https://raw.githubusercontent.com/BeverleyRoundTable/BRT/main/icons/sleigh-wireframe.png" alt="Santa Sleigh Blueprint" class="base-image" id="sleigh-image">
      
      <!-- Hotspots mapped to the Mahindra Treo Silhouette -->
      <div class="hotspot active-dot" style="top: 60%; left: 70%;" data-id="power"></div>
      <div class="hotspot" style="top: 45%; left: 82%;" data-id="audio"></div>
      <div class="hotspot" style="top: 25%; left: 45%;" data-id="lighting"></div>
      <div class="hotspot" style="top: 75%; left: 50%;" data-id="chassis"></div>
    </div>

    <!-- The Sponsor Info Panel -->
    <div class="info-panel" id="sponsor-panel">
      <div class="panel-content">
        <h3 id="panel-title">The Magic Core</h3>
        <h4 id="panel-sponsor" class="highlight-text">Official Power Partner: Zendure</h4>
        <p id="panel-desc">Super power packs to make the sleigh sparkle! These SolarFlow stations provide clean, silent energy to keep Santa glowing all night long without noisy generators.</p>
      </div>
    </div>

  </div>

  <script>
    // =========================================================================
    // 1. YOUR WEB APP URL (Site Analytics / Hub)
    // =========================================================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwyAk3IScj--iNDQUn0ddk5wUH99Gfh6kPnCGmxgHhb4dIOoPRGaRwGT1lD-E9jf8dv/exec"; 

    // =========================================================================
    // 2. COMPONENT DATABASE
    // =========================================================================
    const sleighComponents = {
      power: {
        title: "The Magic Core",
        sponsor: "Official Power Partner: Zendure",
        desc: "Super power packs to make the sleigh sparkle! These SolarFlow stations provide clean, silent energy to keep Santa glowing all night long without noisy generators.",
        logLabel: "Blueprint_Tap_Zendure" 
      },
      audio: {
        title: "Sleigh Bells & Bass",
        sponsor: "Audio by JBL",
        desc: "Linked PartyBox speakers pushing booming Christmas anthems through the streets, making sure you hear Santa before you see him.",
        logLabel: "Blueprint_Tap_JBL"
      },
      lighting: {
        title: "Dynamic Illuminations",
        sponsor: "Powered by Govee",
        desc: "Thousands of smart LEDs mapped across the modular aluminum frame, capable of snowfall effects and reacting live to the music.",
        logLabel: "Blueprint_Tap_Govee"
      },
      chassis: {
        title: "The Sleigh Base",
        sponsor: "Mahindra Treo Platform",
        desc: "A fully electric, zero-emission foundation wrapped in festive magic, keeping the route green and environmentally friendly.",
        logLabel: "Blueprint_Tap_Chassis"
      }
    };

    // =========================================================================
    // 3. FETCH LIVE STATS (DATA OUT)
    // =========================================================================
    if(WEB_APP_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
      fetch(WEB_APP_URL)
        .then(response => response.json())
        .then(data => {
          document.getElementById('live-stats-banner').innerHTML = 
            `🎅 <strong>${data.totalViews}</strong> families have tracked the sleigh live! <br> Top Route: <strong>${data.popularRoute}</strong> | Devices: <strong>${data.deviceSplit}</strong>`;
        })
        .catch(error => {
          console.error("Couldn't load stats", error);
          document.getElementById('live-stats-banner').style.display = 'none';
        });
    }

    // =========================================================================
    // 4. INTERACTION LOGIC & LOGGING (DATA IN)
    // =========================================================================
    const hotspots = document.querySelectorAll('.hotspot');
    const panelTitle = document.getElementById('panel-title');
    const panelSponsor = document.getElementById('panel-sponsor');
    const panelDesc = document.getElementById('panel-desc');
    const infoPanel = document.getElementById('sponsor-panel');

    hotspots.forEach(dot => {
      dot.addEventListener('click', (e) => {
        hotspots.forEach(h => h.classList.remove('active-dot'));
        e.target.classList.add('active-dot');

        const id = e.target.getAttribute('data-id');
        const data = sleighComponents[id];

        infoPanel.classList.remove('fade-in');
        void infoPanel.offsetWidth; 
        
        panelTitle.textContent = data.title;
        panelSponsor.textContent = data.sponsor;
        panelDesc.textContent = data.desc;
        
        infoPanel.classList.add('fade-in');

        if(WEB_APP_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
          fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ sponsorName: data.logLabel })
          }).catch(err => console.error("Tracking failed"));
        }
      });
    });

    // =========================================================================
    // 5. DEV TOOL: COORDINATE FINDER 
    // =========================================================================
    /*
    document.getElementById('sleigh-image').addEventListener('click', function(e) {
      const rect = e.target.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      
      console.log(`Copy this into your HTML hotspot element:`);
      console.log(`style="top: ${y.toFixed(2)}%; left: ${x.toFixed(2)}%;"`);
    });
    */
  </script>

</body>
</html>
