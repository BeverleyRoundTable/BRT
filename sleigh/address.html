<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurboSanta — Spatial Lookup</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Turf.js for Lightning-Fast Client-Side Spatial Math -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <style>
    /* ═══════════════════════════════════════ */
    /* TURBOSANTA DESIGN SYSTEM */
    /* ═══════════════════════════════════════ */
    :root {
      --gold: #FBAF33;
      --gold-dim: rgba(251,175,51,0.12);
      --gold-glow: rgba(251,175,51,0.25);
      --dark: #0d0d0b;
      --surface: #161614;
      --surface-2: #1e1e1b;
      --border: rgba(255,255,255,0.08);
      --text: #eaeae5;
      --text-dim: rgba(255,255,255,0.55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 12px 60px; 
      background: transparent; 
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-y: hidden; 
    }

    #address-root {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    /* ── Map & Geolocation Controls ── */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .locate-btn {
      height: 48px;
      width: 100%;
      border-radius: 8px;
      border: none;
      background: var(--gold);
      color: #000000;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s, background 0.2s;
    }

    .locate-btn:hover { background: #e59d28; }
    .locate-btn:active { transform: scale(0.98); }

    .instruction-text {
      text-align: center;
      font-size: 14px;
      color: var(--text-dim);
    }

    #lookup-map {
      height: 350px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      z-index: 1; /* Keeps Leaflet controls below modals if added later */
    }

    /* ── Results Cards ── */
    #results:empty { margin-top: 0; }
    .addr-route-card {
      background: var(--surface-2);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 20px 24px;
      margin: 20px 0;
    }
    .addr-route-title {
      margin: 0 0 4px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 1.5px;
      color: #fff;
    }
    .addr-route-date {
      margin: 0;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--gold);
    }
    .addr-no-results {
      text-align: center;
      margin-top: 32px;
      font-weight: 600;
      color: var(--gold);
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="address-root">
    
    <div class="controls-wrapper">
      <button id="locateBtn" class="locate-btn">
        <!-- SVG GPS Icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        Use My Current Location
      </button>
      <div class="instruction-text">or simply tap your street on the map below</div>
    </div>

    <div id="lookup-map"></div>
    <div id="results"></div>

  </div>

  <script>
    // Configuration
    const API_URL = "YOUR_API_URL_HERE"; // Replace with your actual TurboSanta API
    const CATCHMENT_METERS = 150; // How close a pin needs to be to a route to trigger a match
    
    let routesData = [];
    let map;
    let userPin = null;

    // 1. Initialize Dark Mode Map over Beverley
    function initMap() {
      map = L.map('lookup-map').setView([53.844, -0.428], 13);
      
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 18
      }).addTo(map);

      // Listen for manual taps on the map
      map.on('click', function(e) {
        processCoordinates(e.latlng.lat, e.latlng.lng);
      });
    }

    // 2. Fetch Master Payload & Parse GPX Data
    async function loadRouteData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        if(data && data.routes) {
          routesData = data.routes;
          
          // Background parse GPX for all routes
          routesData.forEach(async (route) => {
            if (route.gpxUrl) {
              try {
                const gpxRes = await fetch(route.gpxUrl);
                const gpxXml = await gpxRes.text();
                route.geoJSON = parseGPXToLineString(gpxXml);
                
                // Optional: Draw faint gold lines on the map so users know where to click
                if(route.geoJSON) {
                  L.geoJSON(route.geoJSON, { color: '#FBAF33', weight: 3, opacity: 0.2 }).addTo(map);
                }
              } catch (e) { console.error("GPX load failed for", route.routeName); }
            }
          });
        }
      } catch (err) {
        console.error("Failed to fetch route data:", err);
      }
    }

    // 3. Mini XML Parser for GPX -> GeoJSON
    function parseGPXToLineString(xmlStr) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlStr, "text/xml");
      const trackPoints = xmlDoc.getElementsByTagName("trkpt");
      
      const coords = [];
      for (let i = 0; i < trackPoints.length; i++) {
        const lat = parseFloat(trackPoints[i].getAttribute("lat"));
        const lon = parseFloat(trackPoints[i].getAttribute("lon"));
        coords.push([lon, lat]); // Turf requires [Longitude, Latitude]
      }
      
      // Needs at least 2 points to be a valid path
      if (coords.length > 1) {
        return turf.lineString(coords);
      }
      return null;
    }

    // 4. HTML5 Geolocation Trigger
    document.getElementById('locateBtn').addEventListener('click', () => {
      const btn = document.getElementById('locateBtn');
      btn.innerHTML = "Locating...";
      
      if (!navigator.geolocation) {
        alert("Your browser doesn't support geolocation. Please tap the map instead.");
        btn.innerHTML = "Use My Current Location";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          btn.innerHTML = "Use My Current Location";
          processCoordinates(position.coords.latitude, position.coords.longitude);
        },
        (error) => {
          btn.innerHTML = "Use My Current Location";
          alert("Could not get your location. Please check your browser permissions or tap the map directly.");
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    });

    // 5. The Core Spatial Intersection Logic (Updated for Chronological Sorting)
    function processCoordinates(lat, lng) {
      // Manage the map UI
      if (userPin) map.removeLayer(userPin);
      userPin = L.marker([lat, lng]).addTo(map);
      map.setView([lat, lng], 16);

      const userLocation = turf.point([lng, lat]);
      const matchedRoutes = [];
      
      // Get today's date (at midnight) to filter out past routes
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // Calculate distance to every loaded GPX track
      routesData.forEach(route => {
        if (route.geoJSON) {
          const distance = turf.pointToLineDistance(userLocation, route.geoJSON, { units: 'meters' });
          
          if (distance <= CATCHMENT_METERS) {
            
            // Check if the route is in the past
            let isFutureOrToday = true;
            let parsedTime = Infinity; // Default for missing dates so they drop to the bottom

            if (route.date) {
              const routeDate = new Date(route.date);
              if (!isNaN(routeDate)) {
                // Ensure we compare midnight to midnight
                const cleanRouteDate = new Date(routeDate.getFullYear(), routeDate.getMonth(), routeDate.getDate());
                if (cleanRouteDate < today) {
                  isFutureOrToday = false; // It's in the past
                }
                parsedTime = cleanRouteDate.getTime();
              }
            }

            // Only add to results if it hasn't happened yet
            if (isFutureOrToday) {
              matchedRoutes.push({
                ...route,
                distance: Math.round(distance),
                parsedDate: parsedTime
              });
            }
          }
        }
      });

      // Sort primarily by SOONEST DATE. If dates match, sort by shortest distance.
      matchedRoutes.sort((a, b) => {
        if (a.parsedDate !== b.parsedDate) {
          return a.parsedDate - b.parsedDate;
        }
        return a.distance - b.distance; // Tie-breaker
      });
      
      renderResults(matchedRoutes);
    }

    // 6. Render the Results
    function renderResults(matches) {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "";

      if (matches.length === 0) {
        resultsDiv.innerHTML = `
          <div class="addr-no-results">
            No routes found close to this location.
            <small>Try dropping the pin slightly closer to the main road.</small>
          </div>`;
      } else {
        matches.forEach(route => {
          const formattedDate = route.date ? new Date(route.date).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) : "Date TBC";
          
          resultsDiv.innerHTML += `
            <div class="addr-route-card">
              <h3 class="addr-route-title">${route.routeName}</h3>
              <p class="addr-route-date">${formattedDate} (Approx ${route['Start Time'] || '17:30'})</p>
              <p style="margin: 8px 0 0; font-size: 13px; color: var(--text-dim);">
                📍 This route passes roughly ${route.distance} meters from your pin.
              </p>
            </div>
          `;
        });
      }
      sendHeight(); // Resizes the iframe dynamically
    }

    // 7. Iframe Auto-Resize Handlers
    function sendHeight() {
      const height = document.documentElement.scrollHeight;
      parent.postMessage({ addressLookupHeight: height }, "*");
    }

    window.onload = () => {
      initMap();
      loadRouteData();
      sendHeight();
    };

    const observer = new MutationObserver(sendHeight);
    observer.observe(document.body, { childList: true, subtree: true });
    window.addEventListener("resize", sendHeight);

  </script>
</body>
</html>
