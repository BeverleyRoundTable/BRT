<!DOCTYPE html>
<html lang="en-GB" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grants Admin | Beverley Round Table</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/BeverleyRoundTable/BRT/main/icons/BRTLogo.png">
    <meta name="robots" content="noindex">

    <!-- Preload Custom Font for Speed -->
    <link rel="preload" href="https://raw.githubusercontent.com/BeverleyRoundTable/BRT/main/site/Eurostile_Extended_2_Bold.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- Preconnects & Google Fonts (Strictly Open Sans only) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brt: {
                            dark: '#1D1D1A', 
                            gold: '#FBAF33', 
                            white: '#FFFFFF',
                            black: '#000000',
                            light: '#f5f5f3'
                        }
                    },
                    fontFamily: {
                        heading: ['Eurostile', 'sans-serif'], 
                        body: ['Open Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* --- CUSTOM FONTS & BASE STYLES --- */
        @font-face {
            font-family: 'Eurostile';
            src: url('https://raw.githubusercontent.com/BeverleyRoundTable/BRT/main/site/Eurostile_Extended_2_Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        body {
            background-color: #1D1D1A;
            color: #FFFFFF;
        }

        ::selection { background-color: #FBAF33; color: #1D1D1A; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1D1D1A; }
        ::-webkit-scrollbar-thumb { background: #FBAF33; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #d99326; }

        .hero-pattern {
            background-image: radial-gradient(rgba(251, 175, 51, 0.1) 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* --- ANIMATIONS --- */
        .fade-in { opacity: 0; transform: translateY(12px); animation: rise 0.6s ease forwards; }
        @keyframes rise { to { opacity: 1; transform: none; } }
        
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #FBAF33;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- JS STATE TOGGLES --- */
        .msg { display: none; }
        .msg.show { display: block; animation: rise 0.3s ease forwards; }
        
        /* Timeline */
        .tl { position: relative; padding-left: 1.25rem; }
        .tl .ev { position: relative; padding-bottom: 1rem; }
        .tl .ev:before { content: ''; position: absolute; left: -13px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #FBAF33; }
        .tl .ev:after { content: ''; position: absolute; left: -9.5px; top: 16px; bottom: -2px; width: 1px; background: rgba(255,255,255,0.1); }
        .tl .ev:last-child:after { display: none; }
    </style>
</head>
<body class="font-body antialiased min-h-screen flex flex-col relative hero-pattern">

    <!-- Gradient Overlay overlaying the pattern -->
    <div class="fixed inset-0 bg-gradient-to-b from-brt-dark/80 via-brt-dark/40 to-brt-dark -z-10 pointer-events-none"></div>

    <div class="max-w-4xl mx-auto w-full px-4 py-8 relative z-10 flex-grow flex flex-col" id="app">
        <div class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="font-heading font-bold uppercase text-brt-gold tracking-widest mt-4">Loading...</p>
        </div>
    </div>

<script>
// ====== CONFIG — same deployed Apps Script /exec URL the form uses ======
const API_URL = 'https://script.google.com/macros/s/AKfycbyY1kgyrfHGDS_zmDVcpo386oHKP5jGBPKm_bQS4X-k0fKDVPZvsT_AzzutGI6dcXrV/exec';
// ========================================================================

const app = document.getElementById('app');
const LOGO = 'https://raw.githubusercontent.com/BeverleyRoundTable/BRT/main/icons/BRTLogo.png';
const state = { token:null, email:null, status:'new', view:'list' };

const STATUSES = [
  {k:'new',label:'New'},{k:'screening',label:'Parked'},{k:'tabled',label:'Tabled'},
  {k:'approved',label:'Approved'},{k:'paid',label:'Paid'},{k:'reported',label:'Reported'},{k:'declined',label:'Declined'},
  {k:'closed',label:'Closed'},{k:'all',label:'All'}
];
const STATUS_LABEL = {new:'New',screening:'Parked',tabled:'Tabled',approved:'Approved',paid:'Paid',reported:'Reported',declined:'Declined',closed:'Closed'};

/* ---------- helpers ---------- */
async function api(action, payload){
  const body = Object.assign({action, token: state.token}, payload||{});
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
  return r.json();
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gbp = v => { const n = parseInt(v,10); return isNaN(n) ? '—' : '£'+n.toLocaleString('en-GB'); };
const fdate = iso => { if(!iso) return '—'; const d=new Date(iso); return isNaN(d.getTime())?'—':d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const fdt = iso => { if(!iso) return '—'; const d=new Date(iso); return isNaN(d.getTime())?'—':d.toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); };

function badge(s){ 
    const base = "font-heading text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full whitespace-nowrap";
    const styles = {
        'new': 'bg-brt-gold/20 text-brt-gold',
        'screening': 'bg-[#33332e] text-[#c9c9c2]',
        'tabled': 'bg-blue-900/30 text-blue-400',
        'approved': 'bg-green-900/30 text-green-400',
        'paid': 'bg-green-800 text-green-100',
        'reported': 'bg-blue-900/30 text-blue-400',
        'declined': 'bg-red-900/30 text-red-400',
        'closed': 'bg-[#33332e] text-[#8f8f88]'
    };
    return `<span class="${base} ${styles[s] || 'bg-gray-800 text-gray-300'}">${esc(STATUS_LABEL[s]||s)}</span>`; 
}

function flagsHtml(a){
  const out=[];
  const base = "font-heading text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border";
  const standard = `${base} bg-brt-gold/10 text-brt-gold border-brt-gold/30`;
  const danger = `${base} bg-red-900/20 text-red-300 border-red-500/30`;
  
  if(a['Safeguarding flag']) out.push(`<span class="${danger}">Safeguarding</span>`);
  if(a['Conflict flag']) out.push(`<span class="${standard}">Conflict</span>`);
  if(a['Area flag']) out.push(`<span class="${standard}">${esc(a['Area flag'])}</span>`);
  if(a['Cap flag']) out.push(`<span class="${standard}">${esc(a['Cap flag'])}</span>`);
  return out.length ? `<div class="flex flex-wrap gap-2 mt-3">${out.join('')}</div>` : '';
}

/* ---------- boot ---------- */
(function boot(){
  const m = location.hash.match(/token=([^&]+)/);
  if(m){ state.token = decodeURIComponent(m[1]); verifyAndStart(); }
  else renderSignIn();
})();

async function verifyAndStart(){
  app.innerHTML = '<div class="flex flex-col items-center justify-center py-20 fade-in"><div class="loader mb-4"></div><p class="font-heading font-bold uppercase text-brt-gold tracking-widest mt-4">Signing you in...</p></div>';
  try{
    const res = await api('verify', {});
    if(res && res.ok){ state.email = res.email; loadList(); }
    else renderSignIn("That sign-in link has expired or isn't valid — request a new one.");
  }catch(e){ renderSignIn("Couldn't reach the server. Check the link and try again."); }
}

/* ---------- sign in ---------- */
function renderSignIn(note){
  app.innerHTML = `
    <div class="max-w-md mx-auto mt-[8vh] text-center w-full fade-in">
      <img src="${LOGO}" alt="Round Table" class="h-16 mx-auto mb-6 object-contain">
      <h1 class="font-heading font-black text-3xl uppercase tracking-wide text-white mb-2">Grants Admin</h1>
      <p class="font-body text-gray-400 text-sm mb-8">Committee sign-in. We'll email you a secure link.</p>
      
      <div class="bg-white/5 border border-white/10 rounded-2xl p-8 backdrop-blur-sm shadow-xl text-left">
        <label for="em" class="block font-heading font-bold text-sm text-gray-200 uppercase tracking-wide mb-2">Your committee email</label>
        <input type="email" id="em" placeholder="you@roundtable.org.uk" autocomplete="email" 
               class="w-full bg-[#151513] border border-white/10 rounded-xl px-4 py-3 text-white font-body focus:outline-none focus:border-brt-gold transition-colors placeholder-gray-600 mb-6">
        
        <button class="w-full bg-brt-gold text-brt-dark px-6 py-4 rounded-xl font-heading font-extrabold uppercase tracking-widest hover:bg-white transition-all disabled:opacity-50" id="send">
            Email me a link
        </button>
        
        <div class="msg ${note ? 'show bg-red-900/20 border-red-500/30 text-red-400' : ''} border rounded-xl p-4 mt-4 text-sm text-center" id="m">${note?esc(note):''}</div>
      </div>
    </div>`;
    
  const btn = document.getElementById('send'), m = document.getElementById('m');
  btn.onclick = async () => {
    const email = document.getElementById('em').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ m.className='msg show bg-red-900/20 border border-red-500/30 text-red-400 rounded-xl p-4 mt-4 text-sm text-center'; m.textContent='Please enter a valid email.'; return; }
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Sending…';
    try{ await api('requestLink', {email}); }catch(e){}
    m.className='msg show bg-green-900/20 border border-green-500/30 text-green-400 rounded-xl p-4 mt-4 text-sm text-center';
    m.textContent = "If that address is on the committee list, a sign-in link is on its way. It expires in 30 minutes.";
    btn.textContent = 'Link sent';
  };
}

/* ---------- shell + nav ---------- */
function shell(inner){
  return `
    <div class="flex items-center gap-4 py-4 mb-6 border-b border-white/10 fade-in">
      <img src="${LOGO}" alt="BRT Logo" class="h-10 object-contain">
      <div class="font-heading font-extrabold text-lg uppercase tracking-wide text-white hidden sm:block">Grants Admin</div>
      <div class="ml-auto text-right">
          <div class="font-body text-sm font-bold text-gray-200">${esc(state.email||'')}</div>
          <button class="font-heading text-xs uppercase tracking-widest text-brt-gold hover:text-white transition-colors underline decoration-brt-gold/30 hover:decoration-white" id="signout">Sign out</button>
      </div>
    </div>
    <div id="body">${inner}</div>`;
}

function wireShell(){
  const so = document.getElementById('signout');
  if(so) so.onclick = () => { state.token=null; state.email=null; location.hash=''; renderSignIn(); };
}

function navHtml(active){
  const activeClass = "bg-brt-gold/10 border-brt-gold/50 text-brt-gold shadow-md";
  const inactiveClass = "bg-white/5 border-white/10 text-gray-400 hover:border-gray-500 hover:text-gray-200";
  const baseClass = "tab border rounded-lg px-4 py-2 text-xs font-heading font-bold uppercase tracking-wider transition-all cursor-pointer";
  
  return '<div class="flex flex-wrap gap-2 mb-6 fade-in delay-1">' + STATUSES.map(s =>
    `<button class="${baseClass} ${active===s.k ? activeClass : inactiveClass}" data-status="${s.k}">${s.label}</button>`
  ).join('') + 
  `<button class="${baseClass} ${active==='recon' ? activeClass : inactiveClass}" data-status="recon">Reconciliation</button>
   <button class="${baseClass} ${active==='dashboard' ? activeClass : inactiveClass}" data-status="dashboard">Dashboard</button></div>`;
}

function wireNav(){
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    const s = t.dataset.status;
    if(s==='recon'){ loadRecon(); } else if(s==='dashboard'){ loadDashboard(); } else { state.status = s; loadList(); }
  });
}

/* ---------- list ---------- */
async function loadList(){
  state.view='list';
  app.innerHTML = shell(navHtml(state.status) + '<div class="flex flex-col items-center justify-center py-16"><div class="loader mb-4"></div><p class="font-heading font-bold uppercase text-brt-gold tracking-widest mt-4">Loading applications...</p></div>');
  wireShell(); wireNav();
  
  const body = document.getElementById('body');
  let res;
  try{ res = await api('list', {status: state.status}); }
  catch(e){ body.innerHTML = navHtml(state.status)+'<div class="text-center py-16 text-gray-400">Couldn\'t load. Try again.</div>'; wireNav(); return; }
  
  if(!res || !res.ok){ body.innerHTML = navHtml(state.status)+'<div class="text-center py-16 text-red-400">'+esc((res&&res.error)||'Error loading')+'</div>'; wireNav(); return; }
  
  const apps = res.applications||[];
  let list = apps.length
    ? `<div class="space-y-3 fade-in delay-2">` + apps.map(a => `
      <div class="appcard bg-white/5 border border-white/10 rounded-2xl p-5 cursor-pointer hover:border-gray-500 hover:bg-white/10 transition-all transform hover:-translate-y-0.5" data-id="${esc(a['Application ID'])}">
        <div class="flex items-center gap-3 mb-2">
          <span class="font-heading text-sm text-gray-400 tracking-wider">${esc(a['Application ID'])}</span>
          ${badge(a['Status'])}
          <span class="ml-auto font-heading font-black text-lg text-brt-gold">${gbp(a['Status']==='approved'||a['Status']==='paid' ? (a['Amount approved (GBP)']||a['Amount requested (GBP)']) : a['Amount requested (GBP)'])}</span>
        </div>
        <div class="font-body font-bold text-white text-[15px] mb-1">${esc(a['Organisation']||a['Contact name']||'—')}</div>
        <div class="font-body text-sm text-gray-400 truncate">${esc(a['Summary']||'')}</div>
        ${flagsHtml(a)}
      </div>`).join('') + `</div>`
    : '<div class="text-center py-16 text-gray-400 bg-white/5 border border-white/10 rounded-2xl fade-in delay-2">Nothing here.</div>';
    
  const note = '<div class="text-xs text-gray-500 mt-8 pt-4 border-t border-white/10 text-center fade-in delay-2">Decisions are recorded here for the audit trail \u2014 don\u2019t edit the sheet by hand. The sheet holds bank details until a grant is paid, so keep it shared with committee only.</div>';
  
  body.innerHTML = navHtml(state.status) + list + note;
  wireNav();
  document.querySelectorAll('.appcard').forEach(c => c.onclick = () => openDetail(c.dataset.id));
}

/* ---------- detail ---------- */
async function openDetail(id){
  state.view='detail';
  const body = document.getElementById('body');
  if(body) body.innerHTML = '<div class="flex flex-col items-center justify-center py-20 fade-in"><div class="loader mb-4"></div></div>';
  
  let res;
  try{ res = await api('get', {id}); }catch(e){ body.innerHTML='<div class="text-center py-16">Couldn\'t load. <button class="text-brt-gold hover:underline" onclick="loadList()">Back</button></div>'; return; }
  
  if(!res || !res.ok){ body.innerHTML='<div class="text-center py-16 text-red-400">'+esc((res&&res.error)||'Not found')+'</div>'; return; }
  
  const a = res.application, log = res.log||[], pays = res.payments||[];
  const s = a['Status'];

  let alert = '';
  if(a['Safeguarding flag'] || a['Conflict flag']){
    const bits=[];
    if(a['Safeguarding flag']) bits.push('Involves children or vulnerable adults');
    if(a['Conflict flag']) bits.push('Conflict of interest: '+esc(a['Conflict flag']));
    alert = `<div class="bg-red-900/20 border border-red-500/30 rounded-xl p-4 text-sm font-bold text-red-300 mb-6 flex items-start gap-3 fade-in delay-1">
        <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
        <span>${bits.join(' · ')}</span>
    </div>`;
  }

  const sectionClass = "bg-white/5 border border-white/10 rounded-2xl p-6 mb-6 fade-in delay-1";
  const h3Class = "font-heading font-extrabold text-sm uppercase tracking-widest text-brt-gold mb-5 border-b border-white/10 pb-2";
  const dtClass = "text-gray-400 font-bold text-sm mt-1";
  const ddClass = "text-gray-200 text-[15px] break-words mb-4 col-span-2";

  const details = `
    <div class="${sectionClass}">
      <h3 class="${h3Class}">The request</h3>
      <dl class="grid grid-cols-3 gap-x-4">
        <dt class="${dtClass}">Summary</dt><dd class="${ddClass}">${esc(a['Summary']||'—')}</dd>
        <dt class="${dtClass}">Amount requested</dt><dd class="${ddClass}">${gbp(a['Amount requested (GBP)'])}${a['Amount (raw)']&&String(a['Amount (raw)'])!==String(a['Amount requested (GBP)'])?' <span class="text-gray-500 text-sm">(as entered: '+esc(a['Amount (raw)'])+')</span>':''}</dd>
        <dt class="${dtClass}">Who benefits</dt><dd class="${ddClass}">${esc(a['Beneficiaries']||'—')}</dd>
        <dt class="${dtClass}">People helped</dt><dd class="${ddClass}">${esc(a['People helped']||'—')}</dd>
        <dt class="${dtClass}">Other funding</dt><dd class="${ddClass}">${esc(a['Co-funding / shortfall']||'—')}</dd>
        <dt class="${dtClass}">Postcode</dt><dd class="${ddClass}">${esc(a['Postcode']||'—')}</dd>
        <dt class="${dtClass}">Submitted</dt><dd class="${ddClass}">${fdate(a['Submitted (ISO)'])}</dd>
      </dl>
    </div>
    <div class="${sectionClass}">
      <h3 class="${h3Class}">Applicant</h3>
      <dl class="grid grid-cols-3 gap-x-4">
        <dt class="${dtClass}">Contact</dt><dd class="${ddClass}">${esc(a['Contact name']||'—')}</dd>
        <dt class="${dtClass}">Email</dt><dd class="${ddClass}">${a['Email']?'<a href="mailto:'+esc(a['Email'])+'" class="text-brt-gold hover:underline">'+esc(a['Email'])+'</a>':'—'}</dd>
        <dt class="${dtClass}">Phone</dt><dd class="${ddClass}">${esc(a['Phone']||'—')}</dd>
        <dt class="${dtClass}">Organisation</dt><dd class="${ddClass}">${esc(a['Organisation']||'—')}</dd>
      </dl>
      ${a['Bank details'] ? `<div class="mt-4 bg-[#151513] border border-red-500/30 rounded-xl p-4 text-sm"><div class="font-heading font-bold text-[10px] uppercase tracking-widest text-red-400 mb-2">Bank details — sensitive, used only to pay an approved grant</div><div class="text-white">${esc(a['Bank details'])}</div></div>` : ''}
    </div>`;

  const timeline = `
    <div class="${sectionClass}">
      <h3 class="${h3Class}">History</h3>
      <div class="tl">${log.length ? log.map(e=>`
        <div class="ev">
            <div class="text-[11px] text-gray-500 font-bold uppercase tracking-wider">${fdt(e['Timestamp (ISO)'])} ·${esc(e['Officer']||'')}</div>
            <div class="text-white font-bold text-sm mt-1">${esc(e['Event']\vert{}\vert{}'')}</div>${e['Detail']?`<div class="text-gray-400 text-sm mt-1">${esc(e['Detail'])}</div>`:''}
            ${e['Notes']?`<div class="text-gray-400 text-sm italic mt-1 border-l-2 border-brt-gold pl-2">“${esc(e['Notes'])}”</div>`:''}
        </div>`).join('') : '<div class="text-gray-500 italic text-sm">No history yet.</div>'}
      </div>
    </div>`;

  app.innerHTML = shell(`
    <button class="flex items-center gap-2 font-heading font-bold text-xs uppercase tracking-widest text-brt-gold hover:text-white transition-colors mb-6 group fade-in" id="back">
        <i class="fa-solid fa-arrow-left transform group-hover:-translate-x-1 transition-transform"></i> All applications
    </button>
    
    <div class="fade-in">
        <div class="flex items-center gap-3 mb-1">
            <span class="font-heading font-extrabold text-xl text-white tracking-wider">${esc(a['Application ID'])}</span>
            ${badge(s)}
        </div>
        <div class="font-heading font-black text-4xl text-brt-gold mb-1">
            ${gbp(s==='approved'||s==='paid'?(a['Amount approved (GBP)']||a['Amount requested (GBP)']):a['Amount requested (GBP)'])}
        </div>
        <div class="font-body text-gray-400 text-base mb-8">${esc(a['Organisation']||a['Contact name']||'')}</div>
    </div>
    
    ${alert}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div>
            ${actionPanel(a)}
            ${emailPanel(a)}
            ${reportPanel(a)}
        </div>
        <div>
            ${details}
            ${timeline}
        </div>
    </div>
  `);
  wireShell();
  document.getElementById('back').onclick = loadList;
  wireActions(a);
  wireEmail(a);
  wireReport(a);
}

/* ---------- action panels by status ---------- */
function actionPanel(a){
  const s = a['Status'];
  const sectionClass = "bg-white/5 border border-white/10 rounded-2xl p-6 mb-6 fade-in delay-1";
  const h3Class = "font-heading font-extrabold text-sm uppercase tracking-widest text-brt-gold mb-3 border-b border-white/10 pb-2";
  const pClass = "text-xs text-gray-400 mb-4 leading-relaxed";
  const labelClass = "block font-heading font-bold text-xs text-gray-200 uppercase tracking-wide mb-1";
  const inputClass = "w-full bg-[#151513] border border-white/10 rounded-xl px-4 py-2.5 text-white font-body text-sm focus:outline-none focus:border-brt-gold transition-colors placeholder-gray-600 mb-4";
  
  if(s==='new' || s==='screening'){
    return `<div class="${sectionClass}"><h3 class="${h3Class}">Screen</h3>
      <p class="${pClass}">Check it's in our area, an eligible cause, and complete. <b class="text-white">Eligible</b> tables it for the next meeting; <b class="text-white">park</b> it if you need more from the applicant first.</p>
      
      <label for="screenReason" class="${labelClass}">Reason / note <span class="text-gray-500 normal-case tracking-normal">(optional)</span></label>
      <input type="text" id="screenReason" class="${inputClass}" placeholder="e.g. needs a quote before we can table it">
      
      <div class="flex flex-col gap-3 mt-2">
        <button class="w-full bg-green-600 text-white px-4 py-3 rounded-xl font-heading font-bold uppercase tracking-wider hover:bg-green-500 transition-colors" data-screen="eligible">Eligible → Table it</button>
        <button class="w-full bg-transparent border border-white/20 text-white px-4 py-3 rounded-xl font-heading font-bold uppercase tracking-wider hover:border-brt-gold hover:text-brt-gold transition-colors" data-screen="parked">Park (needs info)</button>
        <button class="w-full bg-transparent border border-red-500/30 text-red-400 px-4 py-3 rounded-xl font-heading font-bold uppercase tracking-wider hover:bg-red-900/20 transition-colors" data-screen="ineligible">Ineligible → Close</button>
      </div>

          </div>
      </div>
      
      <label for="minuteRef" class="${labelClass}">Minute reference</label>
      <input type="text" id="minuteRef" class="${inputClass}" placeholder="e.g. 2026-06 item 4">
      
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div><label for="proposer" class="${labelClass}">Proposer</label><input type="text" id="proposer" class="${inputClass.replace('mb-4','')}"></div>
        <div><label for="seconder" class="${labelClass}">Seconder</label><input type="text" id="seconder" class="${inputClass.replace('mb-4','')}"></div>
      </div>
      
      <div class="grid grid-cols-3 gap-3 mb-4">
        <div><label for="vf" class="${labelClass}">For</label><input type="text" id="vf" inputmode="numeric" class="${inputClass.replace('mb-4','')} text-center" value="0"></div>
        <div><label for="va" class="${labelClass}">Against</label><input type="text" id="va" inputmode="numeric" class="${inputClass.replace('mb-4','')} text-center" value="0"></div>
        <div><label for="vab" class="${labelClass}">Abstain</label><input type="text" id="vab" inputmode="numeric" class="${inputClass.replace('mb-4','')} text-center" value="0"></div>

      <label for="amountPaid" class="${labelClass}">Amount paid</label>
      <div class="relative mb-4">
        <span class="absolute left-4 top-2.5 text-gray-400 font-bold">£</span>

      <div class="msg mt-4 rounded-xl p-3 text-sm text-center" id="amsg"></div></div>`;
  }
  return ''; 
}

function wireActions(a){
  const s = a['Status'], id = a['Application ID'];
  const msg = () => document.getElementById('amsg');
  const show = (cls,txt) => { 
      const m = msg(); 
      if(m) { 
          m.className = `msg show border rounded-xl p-3 text-sm text-center mt-4 ${cls === 'err' ? 'bg-red-900/20 border-red-500/30 text-red-400' : 'bg-green-900/20 border-green-500/30 text-green-400'}`; 
          m.textContent = txt; 
      } 
  };

  // screen
  document.querySelectorAll('[data-screen]').forEach(b => b.onclick = async () => {
    const decision = b.dataset.screen;
    b.disabled = true;
    b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
    const res = await api('screen', {id, decision, reason: (document.getElementById('screenReason')||{}).value || ''}).catch(()=>null);
    if(res && res.ok){ openDetail(id); } else { b.disabled=false; b.textContent = b.innerText; show('err',(res&&res.error)||'Failed'); }
  });

  // decision
  const dec = document.getElementById('recordDecision');
  const out = document.getElementById('outcome');
  if(out){ const tog=()=>document.getElementById('approvedAmt').style.display = out.value==='approved'?'block':'none'; out.onchange=tog; tog(); }
  if(dec) dec.onclick = async () => {
    const v = id => (document.getElementById(id)||{}).value || '';
    const payload = {id, outcome:v('outcome'), amountApproved:v('amountApproved'), minuteRef:v('minuteRef'),
      proposer:v('proposer'), seconder:v('seconder'), votesFor:v('vf'), votesAgainst:v('va'), abstentions:v('vab'), notes:v('notes')};
    dec.disabled = true; dec.innerHTML='<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Recording…';
    const res = await api('decide', payload).catch(()=>null);
    if(res && res.ok){ openDetail(id); } else { dec.disabled=false; dec.textContent='Record decision'; show('err',(res&&res.error)||'Failed'); }
  };

  // payment
  const pay = document.getElementById('logPayment');
  if(pay) pay.onclick = async () => {
    const v = id => (document.getElementById(id)||{}).value || '';
    pay.disabled=true; pay.innerHTML='<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Logging…';
    const res = await api('pay', {id, amountPaid:v('amountPaid'), datePaid:v('datePaid'), natwestRef:v('natwestRef'), method:v('method')}).catch(()=>null);
    if(res && res.ok){ openDetail(id); } else { pay.disabled=false; pay.textContent='Log payment'; show('err',(res&&res.error)||'Failed'); }
  };
}

/* ---------- email the applicant ---------- */
function firstName(a){ return (String(a['Contact name']||'').trim().split(/\s+/)[0]) || 'there'; }

function emailTemplate(kind, a){
  const ref = a['Application ID'];
  const fn = firstName(a);
  const amt = gbp(a['Amount approved (GBP)'] || a['Amount requested (GBP)']);
  const org = a['Organisation'] ? (' for ' + a['Organisation']) : '';
  if(kind==='ack') return {
    subject: 'We\u2019ve received your funding request (' + ref + ')',
    body: 'Hi ' + fn + ',\n\nThank you for your funding request to Beverley Round Table' + org + '. We\u2019ve received it and given it the reference ' + ref + '.\n\nOur members consider requests at our monthly meeting, and we\u2019ll be in touch once yours has been looked at. If you need to add anything in the meantime, just reply to this email and quote your reference.\n\nWith best wishes,\nBeverley Round Table'
  };
  if(kind==='moreinfo') return {
    subject: 'Your Beverley Round Table funding request (' + ref + ')',
    body: 'Hi ' + fn + ',\n\nThank you for your funding request (' + ref + '). Before we can put it to our members, we\u2019d be grateful for a little more detail:\n\n- [what you need here]\n\nJust reply to this email with that and we\u2019ll take it from there.\n\nWith best wishes,\nBeverley Round Table'
  };
  if(kind==='approved') return {
    subject: 'Good news about your funding request (' + ref + ')',
    body: 'Hi ' + fn + ',\n\nI\u2019m pleased to let you know that Beverley Round Table has agreed to support your request (' + ref + ') with a grant of ' + amt + '.\n\nWe\u2019ll arrange payment to the account details you gave us \u2014 if anything has changed, just reply and let us know.\n\nWe\u2019d love to hear how it goes, and thank you for the work you do in and around Beverley.\n\nWith best wishes,\nBeverley Round Table'
  };
  if(kind==='declined') return {
    subject: 'Your Beverley Round Table funding request (' + ref + ')',
    body: 'Hi ' + fn + ',\n\nThank you for your funding request (' + ref + '), and for the work you\u2019re doing.\n\nWe\u2019re sorry to say that on this occasion our members weren\u2019t able to support it. We receive more requests than we\u2019re able to fund, so this isn\u2019t a judgement on what you\u2019re setting out to do \u2014 and you\u2019d be very welcome to apply again in future.\n\nWe wish you all the best with it.\n\nWith best wishes,\nBeverley Round Table'
  };
  return { subject: 'Beverley Round Table (' + ref + ')', body: 'Hi ' + fn + ',\n\n\n\nWith best wishes,\nBeverley Round Table' };
}

function emailPanel(a){
  const sectionClass = "bg-white/5 border border-white/10 rounded-2xl p-6 mb-6 fade-in delay-1";
  const h3Class = "font-heading font-extrabold text-sm uppercase tracking-widest text-brt-gold mb-3 border-b border-white/10 pb-2";
  const pClass = "text-xs text-gray-400 mb-4 leading-relaxed";
  const labelClass = "block font-heading font-bold text-xs text-gray-200 uppercase tracking-wide mb-1";
  const inputClass = "w-full bg-[#151513] border border-white/10 rounded-xl px-4 py-2.5 text-white font-body text-sm focus:outline-none focus:border-brt-gold transition-colors placeholder-gray-600 mb-4";

  return `<div class="${sectionClass}"><h3 class="${h3Class}">Email the applicant</h3>
    <p class="${pClass}">Pick a template, edit it to suit, then send. It goes to <b class="text-white">${esc(a['Email']||'\u2014')}</b> and is logged in the history below. Nothing sends until you tap Send.</p>
    
    <label for="emKind" class="${labelClass}">Template</label>
    <select id="emKind" class="${inputClass}">
      <option value="ack">Acknowledge receipt</option>
      <option value="moreinfo">More information needed</option>
      <option value="approved">Approved \u2013 good news</option>
      <option value="declined">Declined</option>
      <option value="custom">Custom (blank)</option>
    </select>
    
    <label for="emSubject" class="${labelClass}">Subject</label>
    <input type="text" id="emSubject" class="${inputClass}">
    
    <label for="emBody" class="${labelClass}">Message</label>
    <textarea id="emBody" rows="10" class="${inputClass} resize-y"></textarea>
    
    <button class="w-full bg-brt-gold text-brt-dark px-4 py-4 rounded-xl font-heading font-extrabold uppercase tracking-widest hover:bg-white transition-colors mt-2" id="emSend">Send email</button>
    <div class="msg mt-4 rounded-xl p-3 text-sm text-center" id="emMsg"></div></div>`;
}

function wireEmail(a){
  const sel = document.getElementById('emKind'); if(!sel) return;
  const subj = document.getElementById('emSubject'), bodyEl = document.getElementById('emBody');
  const fill = () => { const t = emailTemplate(sel.value, a); subj.value = t.subject; bodyEl.value = t.body; };
  const s = a['Status'];
  sel.value = s==='declined' ? 'declined'
            : (s==='approved'||s==='paid') ? 'approved'
            : s==='screening' ? 'moreinfo'
            : s==='new' ? 'ack' : 'custom';
  fill();
  sel.onchange = fill;
  
  const send = document.getElementById('emSend'), msg = document.getElementById('emMsg');
  const showMsg = (cls, txt) => {
      msg.className = `msg show border rounded-xl p-3 text-sm text-center mt-4 ${cls === 'err' ? 'bg-red-900/20 border-red-500/30 text-red-400' : 'bg-green-900/20 border-green-500/30 text-green-400'}`; 
      msg.textContent = txt;
  };

  send.onclick = async () => {
    const subject = subj.value.trim(), message = bodyEl.value.trim();
    if(!a['Email']){ showMsg('err','No applicant email on file.'); return; }
    if(!subject || !message){ showMsg('err','Add a subject and a message first.'); return; }
    
    send.disabled = true; send.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Sending…';
    
    const res = await api('email', {id: a['Application ID'], kind: sel.value, subject, message}).catch(()=>null);
    if(res && res.ok){
      showMsg('ok','Sent to ' + a['Email'] + '.'); send.textContent='Sent';
      setTimeout(() => openDetail(a['Application ID']), 900);
    } else {
      send.disabled = false; send.textContent = 'Send email';
      showMsg('err',(res && res.error) || 'Failed to send.');
    }
  };
}

/* ---------- report-back & publishing ---------- */
function reportPanel(a){
  const s = a['Status'];
  const hasReport = !!a['Report'];
  if(!(s==='paid' || s==='reported' || String(a['Published']).toLowerCase()==='yes' || hasReport)) return '';
  
  const published = String(a['Published']).toLowerCase()==='yes';
  const sectionClass = "bg-white/5 border border-white/10 rounded-2xl p-6 mb-6 fade-in delay-1";
  const h3Class = "font-heading font-extrabold text-sm uppercase tracking-widest text-brt-gold mb-3 border-b border-white/10 pb-2";
  const dtClass = "text-gray-400 font-bold text-sm mt-1";
  const ddClass = "text-gray-200 text-sm break-words mb-4 col-span-2";

  const reportBlock = hasReport
    ? `<dl class="grid grid-cols-3 gap-x-4 mb-4">
        <dt class="${dtClass}">How it went</dt><dd class="${ddClass}">${esc(a['Report'])}</dd>
        ${a['Report photo'] ? `<dt class="${dtClass}">Photo</dt><dd class="${ddClass}"><a href="${esc(a['Report photo'])}" target="_blank" rel="noopener" class="text-brt-gold hover:underline">view</a></dd>` : ''}
        <dt class="${dtClass}">Reported</dt><dd class="${ddClass}">${fdate(a['Reported (ISO)'])}</dd>
        <dt class="${dtClass}">Consent to share</dt><dd class="${ddClass}">${a['Publish consent'] ? '<span class="text-green-400 font-bold">Yes</span>' : '<span class="text-red-400 font-bold">Not given</span>'}</dd>
      </dl>`
    : `<p class="text-xs text-gray-400 mb-4 leading-relaxed">No report-back yet. The beneficiary submits one at the report-back page using their reference and email. You can still publish the basics now if you'd like.</p>`;
    
  const consentWarn = (!published && hasReport && !a['Publish consent'])
    ? `<div class="bg-red-900/20 border border-red-500/30 rounded-xl p-3 text-xs font-bold text-red-300 mt-4 flex items-start gap-2">
        <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
        <span>Heads-up: the beneficiary didn't tick consent to share — check with them before publishing.</span>
       </div>` : '';
       
  const btnClass = published 
      ? "w-full bg-transparent border border-white/20 text-white px-4 py-4 rounded-xl font-heading font-bold uppercase tracking-wider hover:border-red-500 hover:text-red-500 transition-colors"
      : "w-full bg-green-600 text-white px-4 py-4 rounded-xl font-heading font-extrabold uppercase tracking-widest hover:bg-green-500 transition-colors";

  return `<div class="${sectionClass}"><h3 class="${h3Class}">Report-back &amp; public page</h3>
    ${reportBlock}
    <p class="text-xs text-gray-400 mb-4 leading-relaxed">${published ? 'This is live on the public “causes we’ve funded” page.' : 'Publishing shows the cause, what it was for, the amount and any report-back — never the applicant’s name or contact details.'}</p>
    
    <button class="${btnClass}" id="pubToggle" data-pub="${published?'0':'1'}">${published?'Remove from public page':'Publish to public page'}</button>
    ${consentWarn}
    
    <div class="msg mt-4 rounded-xl p-3 text-sm text-center" id="pubMsg"></div></div>`;
}

function wireReport(a){
  const btn = document.getElementById('pubToggle'); if(!btn) return;
  const msg = document.getElementById('pubMsg');
  
  btn.onclick = async () => {
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Saving…';
    const res = await api('publish', {id: a['Application ID'], publish: btn.dataset.pub==='1'}).catch(()=>null);
    if(res && res.ok){ openDetail(a['Application ID']); }
    else { 
        btn.disabled = false; 
        btn.textContent = btn.dataset.pub==='1' ? 'Publish to public page' : 'Remove from public page';
        msg.className='msg show bg-red-900/20 border border-red-500/30 text-red-400 rounded-xl p-3 text-sm text-center mt-4'; 
        msg.textContent = (res && res.error) || 'Failed.'; 
    }
  };
}

/* ---------- dashboard ---------- */
function bar(label, val, max){
  const pct = Math.max(2, Math.round(val / (max||1) * 100));
  return `<div class="mb-3">
    <div class="flex justify-between items-baseline text-sm mb-1">
        <span class="text-gray-300">${esc(label)}</span>
        <span class="font-heading font-bold text-brt-gold">${gbp(val)}</span>
    </div>
    <div class="h-2 bg-[#151513] rounded-full overflow-hidden border border-white/5">
        <div class="h-full bg-gradient-to-r from-brt-gold to-yellow-200 rounded-full min-w-[4px]" style="width:${pct}%"></div>
    </div>
  </div>`;
}

function monthLabel(key){
  const p = String(key).split('-'); const d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, 1);
  return isNaN(d.getTime()) ? key : d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
}

async function loadDashboard(){
  state.view='dashboard';
  app.innerHTML = shell(navHtml('dashboard') + '<div class="flex flex-col items-center justify-center py-16"><div class="loader mb-4"></div><p class="font-heading font-bold uppercase text-brt-gold tracking-widest mt-4">Crunching the numbers...</p></div>');
  wireShell(); wireNav();
  
  const body = document.getElementById('body');
  let res;
  try{ res = await api('dashboard', {}); }catch(e){ body.innerHTML = navHtml('dashboard')+'<div class="text-center py-16 text-gray-400">Couldn\'t load.</div>'; wireNav(); return; }
  
  if(!res || !res.ok){ body.innerHTML = navHtml('dashboard')+'<div class="text-center py-16 text-red-400">'+esc((res&&res.error)||'Error')+'</div>'; wireNav(); return; }
  
  const d = res.stats;
  const decided = (d.fundedCount||0) + (d.declinedCount||0);
  const rate = decided ? Math.round(d.fundedCount/decided*100)+'%' : '—';

  const statClass = "bg-white/5 border border-white/10 rounded-2xl p-5";
  const valClass = "font-heading font-black text-3xl text-brt-gold mb-1";
  const lblClass = "font-heading text-[10px] font-bold uppercase tracking-widest text-gray-400";

  const cards = `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-6 fade-in delay-2">
    <div class="${statClass}"><div class="${valClass}">${gbp(d.totalPaid)}</div><div class="${lblClass}">Given to date</div></div>
    <div class="${statClass}"><div class="${valClass}">${d.fundedCount}</div><div class="${lblClass}">Causes funded</div></div>
    <div class="${statClass}"><div class="${valClass}">${(d.peopleHelped||0).toLocaleString('en-GB')}</div><div class="${lblClass}">People helped</div></div>
    <div class="${statClass}"><div class="${valClass}">${gbp(d.avgGrant)}</div><div class="${lblClass}">Average grant</div></div>
    <div class="${statClass}"><div class="${valClass}">${rate}</div><div class="${lblClass}">Requests funded</div></div>
  </div>`;

  const context = `<div class="text-sm text-gray-400 mb-6 bg-white/5 border border-white/10 rounded-xl p-4 fade-in delay-2 text-center">
    <strong class="text-white">${gbp(d.totalRequested)}</strong> requested across ${d.totalApps} application${d.totalApps===1?'':'s'} · <strong class="text-white">${gbp(d.totalApproved)}</strong> approved · <strong class="text-white">${gbp(d.totalPaid)}</strong> paid out${d.distinctOrgs?` · ${d.distinctOrgs} organisation${d.distinctOrgs===1?'':'s'} supported`:''}.
  </div>`;

  const months = Object.keys(d.byMonth).sort();
  const mMax = Math.max(1, ...months.map(m=>d.byMonth[m]));
  const monthBars = months.length ? months.map(m=>bar(monthLabel(m), d.byMonth[m], mMax)).join('') : '<div class="text-center py-8 text-gray-500 italic bg-[#151513] rounded-xl border border-white/5">No payments logged yet.</div>';

  const areas = Object.keys(d.byArea).sort((a,b)=>d.byArea[b]-d.byArea[a]);
  const aMax = Math.max(1, ...areas.map(a=>d.byArea[a]));
  const areaBars = areas.length ? areas.map(a=>bar(a, d.byArea[a], aMax)).join('') : '<div class="text-center py-8 text-gray-500 italic bg-[#151513] rounded-xl border border-white/5">No payments logged yet.</div>';

  const order = ['new','screening','tabled','approved','paid','reported','declined','closed'];
  const pipeline = order.filter(k=>d.statusCounts[k]).map(k=>`<span class="bg-[#151513] border border-white/10 rounded-full px-4 py-1.5 text-xs font-heading uppercase tracking-wider text-gray-400"><b class="text-white mr-2">${d.statusCounts[k]}</b>${STATUS_LABEL[k]}</span>`).join('') || '<span class="text-gray-500 italic">No applications yet</span>';

  const sectionClass = "bg-white/5 border border-white/10 rounded-2xl p-6 mb-6 fade-in delay-2";
  const h3Class = "font-heading font-extrabold text-sm uppercase tracking-widest text-white mb-5 border-b border-white/10 pb-2";

  body.innerHTML = navHtml('dashboard') + cards + context
    + `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="${sectionClass}"><h3 class="${h3Class}">Giving over time</h3><div>${monthBars}</div></div>
        <div class="${sectionClass}"><h3 class="${h3Class}">Where it's gone <span class="text-gray-500 normal-case tracking-normal">(by postcode area)</span></h3><div>${areaBars}</div></div>
       </div>`
    + `<div class="${sectionClass}"><h3 class="${h3Class}">Pipeline</h3><div class="flex flex-wrap gap-2">${pipeline}</div></div>`
    + `<p class="text-xs text-gray-500 mt-4 text-center fade-in delay-2">Totals are anonymised, so this view is safe to share at an AGM or with sponsors. <b class="text-gray-400">People helped</b> is the applicants' own estimates, summed across funded causes — a guide, not an exact count.</p>`;
  wireNav();
}
</script>
</body>
</html>
