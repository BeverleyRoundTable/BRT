<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --gold: #FBAF33;
      --grey-dark: #1D1D1A;
      --grey-card: #242421;
      --grey-border: #39393455;
      --text: #ecece7;
      --text-muted: #a3a39c;
    }
    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--grey-dark);
      color: var(--text);
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 1px; font-size: 24px; margin-bottom: 20px;}
    
    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--grey-border); padding-bottom: 10px; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; padding: 10px; }
    .tab-btn.active { color: var(--gold); border-bottom: 3px solid var(--gold); margin-bottom: -13px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards */
    .card { background: var(--grey-card); border: 1px solid var(--grey-border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .card-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--grey-border); padding-bottom: 10px; margin-bottom: 15px; }
    .amount { font-size: 20px; font-weight: bold; color: var(--gold); }
    .meta { font-size: 13.5px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.5; }
    .meta strong { color: var(--text); }
    
    /* Form Inputs for Voting */
    .vote-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; background: #1a1a17; padding: 15px; border-radius: 8px; }
    .vote-grid label { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .vote-grid input { width: 100%; background: var(--grey-dark); border: 1px solid var(--grey-border); color: var(--text); padding: 8px; border-radius: 4px; box-sizing: border-box; }
    
    /* Buttons */
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: opacity 0.2s; flex: 1; }
    button:hover { opacity: 0.8; }
    .btn-approve { background: var(--gold); color: #000; }
    .btn-defer { background: #4a4a45; color: #fff; }
    .btn-decline { background: #3a2020; color: #e05a5a; }
    
    .loading { font-style: italic; color: var(--text-muted); }
  </style>
</head>
<body>

  <h1>Requests Dashboard</h1>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('triage')" id="tab-triage">1. Triage (New)</button>
    <button class="tab-btn" onclick="switchTab('voting')" id="tab-voting">2. Meeting Mode (Tabled)</button>
  </div>

  <!-- TRIAGE TAB -->
  <div id="content-triage" class="tab-content active">
    <div id="loading-triage" class="loading">Loading new requests...</div>
    <div id="container-triage"></div>
  </div>

  <!-- VOTING TAB -->
  <div id="content-voting" class="tab-content">
    <div id="loading-voting" class="loading">Loading meeting agenda...</div>
    <div id="container-voting"></div>
  </div>

  <script>
    window.onload = () => { loadTriage(); loadVoting(); };

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('content-' + tabName).classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    // --- TRIAGE LOGIC ---
    function loadTriage() {
      google.script.run.withSuccessHandler(renderTriage).uiGetPending();
    }

    function renderTriage(apps) {
      document.getElementById('loading-triage').style.display = 'none';
      const container = document.getElementById('container-triage');
      if (!apps || !apps.length) return container.innerHTML = '<p>No new requests to screen.</p>';

      container.innerHTML = apps.map(app => `
        <div class="card" id="card-${app['Application ID']}">
          <div class="card-header">
            <div>
              <div style="font-size: 12px; color: var(--text-muted);">${app['Application ID']}</div>
              <strong>${app['Contact name']}</strong> ${app['Organisation'] ? `(${app['Organisation']})` : ''}
            </div>
            <div class="amount">£${app['Amount requested (GBP)']}</div>
          </div>
          <div class="meta"><strong>Summary:</strong> ${app['Summary']}</div>
          <div class="meta"><strong>Beneficiaries:</strong> ${app['Beneficiaries']}</div>
          <div class="btn-group">
            <button class="btn-approve" onclick="screenApp('${app['Application ID']}', 'eligible')">Table for Meeting</button>
            <button class="btn-defer" onclick="screenApp('${app['Application ID']}', 'parked')">Need Info</button>
            <button class="btn-decline" onclick="screenApp('${app['Application ID']}', 'ineligible')">Decline</button>
          </div>
        </div>
      `).join('');
    }

    function screenApp(id, decision) {
      const card = document.getElementById(`card-${id}`);
      card.style.opacity = '0.5'; card.style.pointerEvents = 'none';
      google.script.run.withSuccessHandler(() => {
        card.remove();
        if(decision === 'eligible') loadVoting(); // Refresh meeting tab in background
      }).uiScreenApplication(id, decision);
    }

    // --- VOTING LOGIC ---
    function loadVoting() {
      google.script.run.withSuccessHandler(renderVoting).uiGetTabled();
    }

    function renderVoting(apps) {
      document.getElementById('loading-voting').style.display = 'none';
      const container = document.getElementById('container-voting');
      if (!apps || !apps.length) return container.innerHTML = '<p>Meeting agenda is clear.</p>';

      container.innerHTML = apps.map(app => `
        <div class="card" id="vote-${app['Application ID']}">
          <div class="card-header">
            <div>
              <div style="font-size: 12px; color: var(--text-muted);">${app['Application ID']}</div>
              <strong>${app['Contact name']}</strong> ${app['Organisation'] ? `(${app['Organisation']})` : ''}
            </div>
            <div class="amount">Requested: £${app['Amount requested (GBP)']}</div>
          </div>
          <div class="meta"><strong>Summary:</strong> ${app['Summary']}</div>
          <div class="meta"><strong>Co-funding / Cost:</strong> ${app['Co-funding / shortfall'] || 'Not specified'}</div>
          
          <div class="vote-grid">
            <div><label>Proposer</label><input type="text" id="prop-${app['Application ID']}" placeholder="Name"></div>
            <div><label>Seconder</label><input type="text" id="sec-${app['Application ID']}" placeholder="Name"></div>
            <div><label>£ Approved</label><input type="number" id="amt-${app['Application ID']}" value="${app['Amount requested (GBP)'].replace(/[^0-9]/g, '')}"></div>
            <div><label>Votes For</label><input type="number" id="for-${app['Application ID']}" value="0"></div>
            <div><label>Votes Against</label><input type="number" id="against-${app['Application ID']}" value="0"></div>
            <div><label>Abstain</label><input type="number" id="abs-${app['Application ID']}" value="0"></div>
          </div>

          <div class="btn-group">
            <button class="btn-approve" onclick="submitVote('${app['Application ID']}', 'approved')">Approve Grant</button>
            <button class="btn-defer" onclick="submitVote('${app['Application ID']}', 'deferred')">Defer</button>
            <button class="btn-decline" onclick="submitVote('${app['Application ID']}', 'declined')">Decline</button>
          </div>
        </div>
      `).join('');
    }

    function submitVote(id, outcome) {
      const card = document.getElementById(`vote-${id}`);
      card.style.opacity = '0.5'; card.style.pointerEvents = 'none';
      
      const payload = {
        id: id,
        outcome: outcome,
        proposer: document.getElementById(`prop-${id}`).value,
        seconder: document.getElementById(`sec-${id}`).value,
        amountApproved: document.getElementById(`amt-${id}`).value,
        votesFor: document.getElementById(`for-${id}`).value,
        votesAgainst: document.getElementById(`against-${id}`).value,
        abstentions: document.getElementById(`abs-${id}`).value
      };

      google.script.run.withSuccessHandler(() => card.remove()).uiDecideApplication(payload);
    }
  </script>
</body>
</html>
