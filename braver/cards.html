<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Your Cards Right - Live TV Game</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts for a game show aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: white;
            overflow: hidden; /* Prevent scrolling on large TVs */
            user-select: none; /* Prevent text selection during fast clicks */
        }
        
        .game-title {
            font-family: 'Oswald', sans-serif;
            text-shadow: 2px 4px 6px rgba(0,0,0,0.5);
        }

        /* Card flip animations and styling */
        .card-slot {
            width: 14vw;
            height: 19.5vw;
            max-width: 226px;
            max-height: 314px;
            perspective: 1000px;
            margin: 0 10px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 10px;
        }

        .card-slot.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
        }

        .card-front {
            transform: rotateY(180deg);
            background-color: white; /* Fallback */
        }

        .card-back {
            /* Classic blue bicycle card back pattern via base64 or a solid nice pattern */
            background-color: #1e3a8a;
            background-image: repeating-linear-gradient(45deg, #1e40af 25%, transparent 25%, transparent 75%, #1e40af 75%, #1e40af), repeating-linear-gradient(45deg, #1e40af 25%, #1e3a8a 25%, #1e3a8a 75%, #1e40af 75%, #1e40af);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            border: 4px solid white;
        }

        /* Message Overlay */
        #message-overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }

        /* Button hover effects */
        .game-btn {
            transition: transform 0.1s, filter 0.1s;
        }
        .game-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen p-6">

    <!-- Header Section -->
    <header class="text-center mb-8 flex-shrink-0">
        <h1 class="game-title text-6xl font-bold text-yellow-400 tracking-wider uppercase">
            Play Your Cards Right
        </h1>
        <p class="text-gray-400 text-xl mt-2 font-semibold">Hotkeys: [Space] Reveal Answer | [↑] Higher | [↓] Lower | [Enter] Draw Card</p>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-row gap-8 items-stretch h-full w-full">
        
        <!-- Left Column: Question Area (1/3 width) -->
        <section class="w-1/3 bg-slate-800 rounded-3xl p-8 border-4 border-slate-700 flex flex-col shadow-2xl relative">
            <h2 class="game-title text-3xl text-blue-400 mb-6 border-b-2 border-slate-600 pb-2">The Survey</h2>
            
            <div id="loading-indicator" class="hidden absolute inset-0 bg-slate-800 rounded-3xl flex flex-col items-center justify-center z-10">
                <svg class="animate-spin h-12 w-12 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-xl font-bold animate-pulse text-blue-300">Generating Question...</span>
            </div>

            <div class="flex-1 flex flex-col justify-center text-center">
                <p id="question-text" class="text-3xl font-bold text-white leading-tight mb-8">
                    Click below to generate a new survey question for the crowd!
                </p>
                
                <div id="answer-container" class="hidden flex-col items-center justify-center bg-slate-900 border-4 border-yellow-500 rounded-xl p-6 mb-8 transform scale-0 transition-transform duration-500">
                    <span class="text-gray-400 text-lg uppercase tracking-widest font-bold">Survey Says:</span>
                    <span id="answer-text" class="game-title text-8xl text-yellow-400 font-bold">--</span>
                </div>
            </div>

            <div class="flex flex-col gap-4 mt-auto">
                <button id="btn-generate-q" class="game-btn bg-blue-600 hover:bg-blue-500 text-white text-2xl font-bold py-4 rounded-xl shadow-[0_6px_0_#1e3a8a] active:shadow-[0_0px_0_#1e3a8a] active:translate-y-[6px]">
                    Generate Question
                </button>
                <button id="btn-reveal-a" class="game-btn bg-yellow-500 hover:bg-yellow-400 text-black text-2xl font-bold py-4 rounded-xl shadow-[0_6px_0_#b45309] active:shadow-[0_0px_0_#b45309] active:translate-y-[6px] opacity-50 cursor-not-allowed" disabled>
                    Reveal Answer (Space)
                </button>
            </div>
        </section>

        <!-- Right Column: Card Game Area (2/3 width) -->
        <section class="w-2/3 bg-slate-800 rounded-3xl p-8 border-4 border-slate-700 flex flex-col shadow-2xl items-center justify-between relative overflow-hidden">
            <h2 class="game-title text-3xl text-red-400 mb-2 border-b-2 border-slate-600 pb-2 w-full text-left">The Board</h2>
            
            <!-- Cards Container -->
            <div id="cards-container" class="flex flex-row justify-center items-center w-full flex-1 my-4 perspective-container">
                <!-- Cards will be injected here via JS -->
            </div>

            <!-- Controls -->
            <div class="flex flex-row gap-8 w-full justify-center pb-4">
                <button id="btn-higher" class="game-btn w-64 bg-green-600 hover:bg-green-500 text-white text-5xl font-bold py-8 rounded-2xl shadow-[0_8px_0_#166534] active:shadow-[0_0px_0_#166534] active:translate-y-[8px] flex flex-col items-center opacity-50 cursor-not-allowed" disabled>
                    <span>HIGHER</span>
                    <span class="text-2xl opacity-75 mt-2">↑ (Up Arrow)</span>
                </button>
                
                <div class="flex flex-col justify-center items-center px-4">
                     <button id="btn-start-game" class="game-btn bg-purple-600 hover:bg-purple-500 text-white text-xl font-bold py-4 px-8 rounded-xl shadow-[0_4px_0_#581c87] active:shadow-[0_0px_0_#581c87] active:translate-y-[4px] mb-4">
                        Reset / New Deck
                    </button>
                </div>

                <button id="btn-lower" class="game-btn w-64 bg-red-600 hover:bg-red-500 text-white text-5xl font-bold py-8 rounded-2xl shadow-[0_8px_0_#991b1b] active:shadow-[0_0px_0_#991b1b] active:translate-y-[8px] flex flex-col items-center opacity-50 cursor-not-allowed" disabled>
                    <span>LOWER</span>
                    <span class="text-2xl opacity-75 mt-2">↓ (Down Arrow)</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Win/Loss Overlay -->
    <div id="message-overlay" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center">
        <h1 id="overlay-title" class="game-title text-9xl font-bold mb-4 text-center">WINNER!</h1>
        <p id="overlay-sub" class="text-4xl text-gray-200 mb-12 text-center">You played your cards right!</p>
        <button id="btn-close-overlay" class="game-btn bg-white text-black text-3xl font-bold py-4 px-12 rounded-full shadow-xl hover:bg-gray-200">
            Continue / Next Player
        </button>
    </div>

    <script>
        // --- Configuration & State ---
        const GEMINI_API_KEY = ""; // Environment handles this
        const DECK_API_BASE = "https://deckofcardsapi.com/api/deck";
        const TOTAL_CARDS_IN_GAME = 5; // How many cards they need to guess across
        
        let deckId = null;
        let drawnCards = []; // Store fetched card objects
        let currentCardIndex = -1; // Which card on the board we are currently comparing against
        let gameActive = false;

        // --- DOM Elements ---
        const btnGenQ = document.getElementById('btn-generate-q');
        const btnRevA = document.getElementById('btn-reveal-a');
        const qText = document.getElementById('question-text');
        const aContainer = document.getElementById('answer-container');
        const aText = document.getElementById('answer-text');
        const loadingInd = document.getElementById('loading-indicator');
        
        const cardsContainer = document.getElementById('cards-container');
        const btnHigher = document.getElementById('btn-higher');
        const btnLower = document.getElementById('btn-lower');
        const btnStart = document.getElementById('btn-start-game');
        
        const overlay = document.getElementById('message-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySub = document.getElementById('overlay-sub');
        const btnCloseOverlay = document.getElementById('btn-close-overlay');

        // --- Helper: Get Numeric Value of Card ---
        function getCardValue(valueString) {
            if (!valueString) return 0;
            const val = valueString.toUpperCase();
            if (val === 'ACE') return 14; // Ace is high
            if (val === 'KING') return 13;
            if (val === 'QUEEN') return 12;
            if (val === 'JACK') return 11;
            if (val === '0') return 10; // Some APIs use 0 for 10
            return parseInt(val, 10);
        }

        // --- Audio Context (Optional: visual beeps without sound files) ---
        // Creating a simple synth beep for UI feedback without external files
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, type, duration, vol=0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // --- Question Generation Logic (Gemini API) ---
        async function generateQuestion() {
            loadingInd.classList.remove('hidden');
            btnGenQ.disabled = true;
            btnRevA.disabled = true;
            aContainer.classList.add('scale-0');
            aContainer.classList.remove('scale-100', 'flex');
            aContainer.classList.add('hidden');
            qText.innerText = "";

            try {
                const prompt = "You are a gameshow writer. Generate a completely random, fun 'We asked 100 people...' survey question suitable for a crowd pub game. The theoretical answer MUST be an integer between 1 and 100 representing the number of people who agreed or fit the criteria. Return the response as a strict JSON object with two keys: 'question' (string) and 'answer' (integer). Make the question interesting and varying topics (e.g. food, daily habits, funny opinions).";
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                question: { type: "STRING" },
                                answer: { type: "INTEGER" }
                            },
                            required: ["question", "answer"]
                        }
                    }
                };

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const jsonRes = JSON.parse(data.candidates[0].content.parts[0].text);
                    qText.innerText = jsonRes.question;
                    aText.innerText = jsonRes.answer;
                    
                    // Enable reveal button
                    btnRevA.disabled = false;
                    btnRevA.classList.remove('opacity-50', 'cursor-not-allowed');
                    playBeep(600, 'sine', 0.1);
                } else {
                    throw new Error("Invalid response format from Gemini");
                }

            } catch (error) {
                console.error("Error fetching question:", error);
                qText.innerText = "Error generating question. Please check network and try again.";
            } finally {
                loadingInd.classList.add('hidden');
                btnGenQ.disabled = false;
            }
        }

        // --- Card Game Logic (Deck of Cards API) ---
        async function initializeGame() {
            gameActive = false;
            drawnCards = [];
            currentCardIndex = -1;
            setButtonsState(false);
            
            // Clear board and add empty slots
            cardsContainer.innerHTML = '';
            for(let i=0; i<TOTAL_CARDS_IN_GAME; i++) {
                cardsContainer.innerHTML += `
                    <div class="card-slot" id="slot-${i}">
                        <div class="card-inner">
                            <div class="card-front flex items-center justify-center text-gray-300 bg-white border border-gray-200">
                                <svg class="animate-spin h-8 w-8 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </div>
                            <div class="card-back"></div>
                        </div>
                    </div>
                `;
            }

            try {
                // Get a new shuffled deck
                let res = await fetch(`${DECK_API_BASE}/new/shuffle/?deck_count=1`);
                let data = await res.json();
                deckId = data.deck_id;

                // Draw exactly the number of cards needed for the board to prevent latency during gameplay
                let drawRes = await fetch(`${DECK_API_BASE}/${deckId}/draw/?count=${TOTAL_CARDS_IN_GAME}`);
                let drawData = await drawRes.json();
                
                drawnCards = drawData.cards;
                
                // Inject card images into the DOM (still hidden behind 'card-back')
                drawnCards.forEach((card, index) => {
                    const slot = document.getElementById(`slot-${index}`);
                    const front = slot.querySelector('.card-front');
                    front.innerHTML = ''; // remove spinner
                    front.style.backgroundImage = `url('${card.image}')`;
                });

                // Automatically reveal the first card
                setTimeout(() => {
                    revealNextCard(0);
                    currentCardIndex = 0;
                    gameActive = true;
                    setButtonsState(true);
                }, 500);

            } catch(e) {
                console.error("Error setting up deck:", e);
                alert("Failed to connect to the card API. Please check your internet connection.");
            }
        }

        function setButtonsState(enabled) {
            if (enabled && gameActive) {
                btnHigher.disabled = false;
                btnHigher.classList.remove('opacity-50', 'cursor-not-allowed');
                btnLower.disabled = false;
                btnLower.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btnHigher.disabled = true;
                btnHigher.classList.add('opacity-50', 'cursor-not-allowed');
                btnLower.disabled = true;
                btnLower.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function revealNextCard(index) {
            const slot = document.getElementById(`slot-${index}`);
            if (slot) {
                slot.classList.add('flipped');
                playBeep(800, 'square', 0.1, 0.05);
            }
        }

        function showMessage(title, sub, colorClass) {
            overlayTitle.innerText = title;
            overlayTitle.className = `game-title text-9xl font-bold mb-4 text-center ${colorClass}`;
            overlaySub.innerText = sub;
            overlay.classList.remove('hidden');
            setButtonsState(false);
            gameActive = false;
            playBeep(title === 'WINNER!' ? 1000 : 200, title === 'WINNER!' ? 'sine' : 'sawtooth', 0.5, 0.2);
        }

        function handleGuess(guess) {
            if (!gameActive || currentCardIndex >= TOTAL_CARDS_IN_GAME - 1) return;

            setButtonsState(false); // Disable buttons temporarily to prevent double click
            
            const currentCard = drawnCards[currentCardIndex];
            const nextCard = drawnCards[currentCardIndex + 1];
            
            const currentVal = getCardValue(currentCard.value);
            const nextVal = getCardValue(nextCard.value);
            
            // Reveal the next card
            revealNextCard(currentCardIndex + 1);
            
            setTimeout(() => {
                let wonRound = false;
                
                if (nextVal === currentVal) {
                    // Tie is a loss in classic Play Your Cards Right ("You get nothing for a pair!")
                    showMessage("YOU LOSE!", "You get nothing for a pair, not in this game!", "text-red-500");
                    return;
                }
                
                if (guess === 'higher' && nextVal > currentVal) wonRound = true;
                if (guess === 'lower' && nextVal < currentVal) wonRound = true;
                
                if (wonRound) {
                    currentCardIndex++;
                    if (currentCardIndex === TOTAL_CARDS_IN_GAME - 1) {
                        showMessage("WINNER!", "You played your cards right!", "text-green-500");
                    } else {
                        // Continue playing
                        setButtonsState(true);
                        playBeep(1200, 'sine', 0.1);
                    }
                } else {
                    showMessage("YOU LOSE!", `The card was ${nextCard.value.toLowerCase()}!`, "text-red-500");
                }
            }, 800); // Wait for flip animation before resolving logic
        }


        // --- Event Listeners ---
        btnGenQ.addEventListener('click', generateQuestion);
        
        btnRevA.addEventListener('click', () => {
            if (!btnRevA.disabled) {
                aContainer.classList.remove('hidden');
                // slight delay to allow display block before transition
                setTimeout(() => {
                    aContainer.classList.remove('scale-0');
                    aContainer.classList.add('flex', 'scale-100');
                    playBeep(400, 'triangle', 0.4, 0.2);
                }, 50);
                btnRevA.disabled = true;
                btnRevA.classList.add('opacity-50', 'cursor-not-allowed');
            }
        });

        btnStart.addEventListener('click', initializeGame);
        
        btnHigher.addEventListener('click', () => handleGuess('higher'));
        btnLower.addEventListener('click', () => handleGuess('lower'));
        
        btnCloseOverlay.addEventListener('click', () => {
            overlay.classList.add('hidden');
            // Do not auto-restart here, let the host do it when ready
        });

        // Keyboard Hotkeys
        document.addEventListener('keydown', (e) => {
            // Prevent default behavior for game keys if we aren't in an input (which we aren't, but good practice)
            
            if (e.code === 'Space') {
                e.preventDefault();
                if (!btnRevA.disabled) {
                    btnRevA.click();
                } else if (!overlay.classList.contains('hidden')) {
                   btnCloseOverlay.click();
                }
            } else if (e.code === 'ArrowUp') {
                e.preventDefault();
                if (!btnHigher.disabled && gameActive) {
                    // Visual feedback
                    btnHigher.classList.add('bg-green-400');
                    setTimeout(() => btnHigher.classList.remove('bg-green-400'), 150);
                    handleGuess('higher');
                }
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                if (!btnLower.disabled && gameActive) {
                    // Visual feedback
                    btnLower.classList.add('bg-red-400');
                    setTimeout(() => btnLower.classList.remove('bg-red-400'), 150);
                    handleGuess('lower');
                }
            } else if (e.code === 'Enter') {
                e.preventDefault();
                // Can be used to draw the first card / start game
                if (!gameActive && overlay.classList.contains('hidden')) {
                   btnStart.click();
                }
            }
        });

        // Initial setup on load
        window.addEventListener('load', () => {
            // We do not auto-initialize the game or API call to save rate limits
            // The host will click the buttons when ready.
            // Setup the empty board placeholder
            cardsContainer.innerHTML = '';
            for(let i=0; i<TOTAL_CARDS_IN_GAME; i++) {
                cardsContainer.innerHTML += `
                    <div class="card-slot">
                        <div class="card-inner">
                            <div class="card-back"></div>
                        </div>
                    </div>
                `;
            }
        });

    </script>
</body>
</html>
